      MAP_PLATFORM_STRAVA_REDIRECT_URI: ${MAP_PLATFORM_STRAVA_REDIRECT_URI:-}
      MAP_PLATFORM_STRAVA_TOKEN_KEY_ID: ${MAP_PLATFORM_STRAVA_TOKEN_KEY_ID:-}
      MAP_PLATFORM_STRAVA_TOKEN_KEY_BASE64: ${MAP_PLATFORM_STRAVA_TOKEN_KEY_BASE64:-}
      MAP_PLATFORM_STRAVA_PREVIOUS_TOKEN_KEYS: ${MAP_PLATFORM_STRAVA_PREVIOUS_TOKEN_KEYS:-}
      MAP_PLATFORM_STRAVA_CONNECTION_IDLE_TTL_DAYS: ${MAP_PLATFORM_STRAVA_CONNECTION_IDLE_TTL_DAYS:-30}
