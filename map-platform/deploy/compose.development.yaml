# control-plane-source-commit: 0526fac0576d2bf7b0d3ef8a793041f5bcf84fca
# worker-source-commit: 0526fac0576d2bf7b0d3ef8a793041f5bcf84fca

# These digest-pinned images are the development deployment manifest. The
# development promotion advances the API, maintenance, and worker together,
# independently of the hardware-gated production lock. Keep each source commit
# and digest in sync through update_image.py; never use a mutable tag.
#
# The current pins predate the repository relocation and expose `/app/backend`
# and `/app/config`. New images retain aliases at those paths so control-plane
# and worker pins can advance independently without a coordinated outage.
x-map-platform-images:
  control-plane: &map-platform-control-plane-image ghcr.io/seichris/open-bike-computer-map-platform@sha256:4db7177aad12fbc7c7389fc3f1db8118cf32c69078e95fc95c2853126f7c7734
