; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = ESP32 GPS Navigator
default_envs = WAVESHARE_AMOLED_175

; Shared metadata read by prebuild.py and the factory packager. Every build
; environment extends waveshare_amoled_common below.
[common]
version = 0.3.4
revision = 106

[waveshare_common]
board = esp32-s3-devkitc-1
lib_ldf_mode = deep
board_build.mcu = esp32s3
; Build ESP-IDF power-management support into every Waveshare profile. Runtime
; code enables 80-240 MHz dynamic frequency scaling explicitly. Tickless idle
; stays disabled until the separate automatic-light-sleep phase has passed its
; physical lock/soak gates.
custom_sdkconfig =
  ; Core descriptors must not depend on the source commit's build clock.
  ; Exact Git identity and timestamp live in firmware_metadata instead.
  CONFIG_APP_COMPILE_TIME_DATE=n
  CONFIG_BOOTLOADER_COMPILE_TIME_DATE=n
  CONFIG_PM_ENABLE=y
  CONFIG_PM_DFS_INIT_AUTO=n
  CONFIG_PM_PROFILING=n
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=n
  ; Preserve the current production watchdog contract explicitly: IDLE0 is
  ; the only subscribed idle task and a timeout is a fatal, attributable reset.
  CONFIG_ESP_TASK_WDT_INIT=y
  CONFIG_ESP_TASK_WDT_PANIC=y
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=5
  CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=y
  CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1=n
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  ; Bluetooth controller interrupt allocation runs on ipc0. The pinned
  ; Arduino S3 config's 1024-byte IPC stack overflowed during interrupt entry.
  ; Budget the call chain plus interrupt context and guard space on both cores.
  CONFIG_ESP_IPC_TASK_STACK_SIZE=1536
  ; Authenticated iPhone writes can enqueue structured diagnostics from the
  ; NimBLE callback. The ATT dispatch plus JSON formatter exceeds 5120 bytes.
  CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
  ; Native SDMMC, hardware AES, and the P-256 device-transfer TLS handshake need
  ; internal DMA-capable memory. PR #331 physically validated 32 KiB for SDMMC
  ; plus BLE AES. Exact-head transfer testing later classified MbedTLS
  ; -0x7f00 with only a 14,836-byte largest internal/DMA block despite this
  ; former 64 KiB reserve and more than 3.5 MiB contiguous PSRAM. A 1.75-inch
  ; Wi-Fi startup attempt then failed with a 14,836-byte largest block and
  ; another panicked in the Wi-Fi AP task. Reserve 96 KiB for an exact-image
  ; hardware experiment; this setting is not yet physically qualified. Keep
  ; ESP-IDF's default allocator so large record buffers may use PSRAM while
  ; internal-only crypto allocations retain the reserve. Preserve the full 16 KiB inbound
  ; record size used for iPhone uploads, but cap server output records at 4 KiB.
  ; The asymmetric buffers alone still failed inside mbedtls_ssl_setup, whose
  ; static path allocates both records before the handshake. Use ESP-IDF's
  ; supported dynamic record-buffer path so RX and TX storage is allocated only
  ; while each record is processed. This firmware has no DTLS consumer, and the
  ; exact ESP-IDF implementation requires DTLS to be disabled. Do not enable
  ; dynamic certificate/config freeing or force every MbedTLS allocation into
  ; external memory.
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=98304
  ; Task-only staging buffers use external BSS. Initialize and test PSRAM
  ; before zeroing that section or running C++ constructors; Arduino's late
  ; init is too late. IDF also places its supported network/Bluetooth BSS in
  ; PSRAM. Missing/bad PSRAM must fail boot, never alias internal/DMA memory.
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_MEMTEST=y
  CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
  CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=n
  CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC=y
  CONFIG_MBEDTLS_CUSTOM_MEM_ALLOC=n
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  ; No Waveshare profile has a cellular modem or any other PPP consumer, yet
  ; the Arduino default compiles lwIP PPP plus its esp_netif glue into every
  ; image (about 20 KiB of flash). Wi-Fi, BLE and the transfer server do not
  ; use it.
  CONFIG_LWIP_PPP_SUPPORT=n
  ; Nothing routes between the device's access point and another network:
  ; the Arduino default compiles lwIP IP forwarding and NAPT (about 4.5 KiB)
  ; whose only caller, APClass::enableNAPT, the firmware never uses.
  CONFIG_LWIP_IP_FORWARD=n
  ; The device never advertises or uses IPv6: the app reaches it over the
  ; BLE-delivered IPv4 baseUrl, and mDNS stays on IPv4.
  CONFIG_LWIP_IPV6=n
  CONFIG_LWIP_IPV4_NAPT=n
; This board uses 8MB/16MB Flash and OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.filesystem = fatfs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
  pre:prebuild.py
  post:tools/record_flash_plan.py
; pioarduino's custom SDK build drops its private CONFIG_LIB_BUILDER_COMPILE
; symbol, so ESP-Diagnostics does not provide the log_printf wrapper that the
; stock link flags request. This firmware does not use ESP Insights; link
; Arduino logging directly instead of depending on that absent wrapper.
build_unflags =
  -Wl,--wrap=log_printf

; Use pioarduino platform for Arduino Core 3.x (required for Arduino_GFX 1.4.7+).
; Pin the release archive so GitHub release firmware matches locally tested builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
framework = arduino

; Use Arduino_GFX-compatible libraries
lib_deps =
  https://github.com/jgauchia/NeoGPS.git#43c47665f3f8a1b809d809d9f685b376edd40238
  lvgl/lvgl@9.2.2
  moononournation/GFX Library for Arduino @ 1.6.7
  jpb10/SolarCalculator@2.0.1
  ; NimBLE for iOS navigation overlay feature
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@7.4.3

build_flags =
  -I include  ; Add global include directory to path
  ; pioarduino's Arduino-only application pass does not retain the interface
  ; link options from ESP-IDF's configurable MbedTLS target. Match the exact
  ; wrapper set selected by CONFIG_MBEDTLS_DYNAMIC_BUFFER so calls resolve to
  ; the custom core's on-demand record-buffer implementation.
  -Wl,--wrap=mbedtls_ssl_write_client_hello
  -Wl,--wrap=mbedtls_ssl_handshake_client_step
  -Wl,--wrap=mbedtls_ssl_tls13_handshake_client_step
  -Wl,--wrap=mbedtls_ssl_handshake_server_step
  -Wl,--wrap=mbedtls_ssl_read
  -Wl,--wrap=mbedtls_ssl_write
  -Wl,--wrap=mbedtls_ssl_session_reset
  -Wl,--wrap=mbedtls_ssl_free
  -Wl,--wrap=mbedtls_ssl_setup
  -Wl,--wrap=mbedtls_ssl_send_alert_message
  -Wl,--wrap=mbedtls_ssl_close_notify
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  ; Dev-only BLE pairing recovery: bypasses the persisted random static BLE
  ; identity and makes iOS see a fresh peripheral after each firmware boot.
  ; Keep disabled for normal reconnect behavior.
  ; -DBLE_DEV_RANDOM_IDENTITY=1
  ; Production builds keep the QMI8658 only for the bounded ride-automation
  ; detector; standalone diagnostics remain disabled below.
  ; Use one of the dedicated *_IMU_DIAGNOSTICS environments for bring-up.
  ; microSD uses the ESP32-S3 native one-bit SDMMC peripheral on the vendor
  ; pins: CLK=2, CMD=1, D0=3. The conservative default is 20 MHz; validate a
  ; different value across both board families and representative cards.
  ; -DWAVESHARE_SDMMC_FREQ_KHZ=20000
  ; A native mount failure may use the former isolated HSPI path only for the
  ; one-time migration boot. Keep its verified conservative 4 MHz default.
  ; -DWAVESHARE_SD_MIGRATION_SPI_FREQ_HZ=4000000
  ; Map I/O timing is verbose; enable only for targeted SD/map profiling.
  ; -DWAVESHARE_MAPIO_TIMING_LOG=1
  ; Root directory listing is noisy and disabled by default.
  ; -DWAVESHARE_SD_LIST_ROOT=1
  -DDEFAULT_LAT=35.16755
  -DDEFAULT_LON=136.89451
  -Wno-error=return-type  ; Disable error for missing return statements (NeoGPS compatibility)
  -Wno-error=address-of-packed-member  ; Disable packed member warnings
  -D LV_CONF_PATH="${PROJECT_DIR}/lib/lvgl/lv_conf.h"
  -D BAUDRATE=115200
  ; Do not define the generic DEBUG macro. Custom ESP-IDF core builds inherit
  ; application flags, and DEBUG collides with IDF/NimBLE log-level tokens.
  ; Keep debug, diagnostics, and USB CDC values in concrete profiles. The
  ; pioarduino custom-core path expands inherited flags before PlatformIO
  ; applies build_unflags, so shared values would collide with production
  ; overrides inside ESP-IDF components compiled with -Werror.
  ; Arduino's sdkconfig.h defines NimBLE's connection limit after command-line
  ; macros. Preinclude our override so every locally built NimBLE source agrees
  ; that the ownership protocol permits exactly one central.
  -include include/nimble_connection_config.h
  ; AMOLEDs need high brightness commands, usually handled in driver,
  ; but we define a default here just in case.
  -DTFT_BL=-1
  ; The generic esp32s3 variant maps digitalWrite(RGB_BUILTIN) to an RMT-driven
  ; RGB LED on GPIO 48. Neither Waveshare board has that LED and nothing here
  ; writes it, but the hook alone linked the RMT driver (about 20 KiB of
  ; flash). Drop the hook; plain GPIO 48 access is unaffected.
  -DESP32_ARDUINO_NO_RGB_BUILTIN

[waveshare_amoled_common]
extends = waveshare_common
build_flags =
  ${waveshare_common.build_flags}

[waveshare_amoled_175_base]
extends = waveshare_amoled_common
custom_sdkconfig =
  ${waveshare_amoled_common.custom_sdkconfig}
  ; The 175's BLE host pools fragmented the internal/DMA heap below the
  ; 32 KiB Wi-Fi startup floor. Use NimBLE's supported PSRAM buffer allocator;
  ; its host task stack, controller and DMA allocations remain internal.
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=n
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_DEFAULT=n
custom_firmware_target = WAVESHARE_AMOLED_175
build_flags =
  ${waveshare_amoled_common.build_flags}
  -DWAVESHARE_AMOLED_175
  -DPERSISTENT_RIDE_DIAGNOSTICS=1

[env:WAVESHARE_AMOLED_175]
extends = waveshare_amoled_175_base
; Developer diagnostics are USB-flashed, never release OTA artifacts. Keep
; them out of the release profile's 4 MiB OTA slot and its reserve while
; preserving the same FFat start offset used by production firmware.
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${waveshare_amoled_175_base.build_flags}
  -DCORE_DEBUG_LEVEL=2
  -DFIRMWARE_DIAGNOSTICS=1
  -DMAP_STABLE_CAMERA=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DRIDE_AUTOMATION_SHADOW=1
  ; End-to-end RAUT control is enabled in both ordinary and production
  ; profiles; this development profile additionally keeps USB diagnostics and
  ; the one-Hz normalized trace stream.
  -DRIDE_AUTOMATION_INTERNAL_CONTROL=1
  -DDETAILED_RIDE_DIAGNOSTICS=1
  -DRIDE_AUTOMATION_TRACE=1

; Opt-in real-device browser debugging. This is ordinary developer firmware
; plus the authenticated framebuffer/input service; release profiles never
; inherit it.
[env:WAVESHARE_AMOLED_175_REMOTE_DEBUG]
extends = env:WAVESHARE_AMOLED_175
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${env:WAVESHARE_AMOLED_175.build_flags}
  -DDEVICE_REMOTE_DEBUG=1
  ; Nearby and ambient POIs remain a development-only hardware gate until
  ; both board families complete physical acceptance.
  -DMAP_POIS_RUNTIME_ENABLED=1
  ; Public development map signer for Bicino Dev physical testing. Ordinary
  ; and production profiles remain production-trust-only.
  -DMAP_STREAM_DEVELOPMENT_TRUST=1

[env:WAVESHARE_AMOLED_175_POWER_METRICS]
extends = env:WAVESHARE_AMOLED_175
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${env:WAVESHARE_AMOLED_175.build_flags}
  -DPOWER_METRICS=1
  ; Set to a verified spare output pin when correlating source-monitor traces.
  ; -DPOWER_METRICS_PULSE_GPIO=XX

; Opt-in Phase 7B characterization build. Ordinary, production, and power-
; metrics environments keep automatic light sleep disabled until this image
; passes the physical BLE/display/touch/storage/audio/transfer soak gates.
[env:WAVESHARE_AMOLED_175_LIGHT_SLEEP]
extends = env:WAVESHARE_AMOLED_175_POWER_METRICS
custom_sdkconfig =
  CONFIG_APP_COMPILE_TIME_DATE=n
  CONFIG_BOOTLOADER_COMPILE_TIME_DATE=n
  CONFIG_PM_ENABLE=y
  CONFIG_PM_DFS_INIT_AUTO=n
  CONFIG_PM_PROFILING=n
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_PM_LIGHT_SLEEP_CALLBACKS=y
  CONFIG_ESP_TASK_WDT_INIT=y
  CONFIG_ESP_TASK_WDT_PANIC=y
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=5
  CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=y
  CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1=n
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  CONFIG_ESP_IPC_TASK_STACK_SIZE=1536
  CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=98304
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_MEMTEST=y
  CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
  CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=n
  CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC=y
  CONFIG_MBEDTLS_CUSTOM_MEM_ALLOC=n
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_LWIP_PPP_SUPPORT=n
  ; Nothing routes between the device's access point and another network:
  ; the Arduino default compiles lwIP IP forwarding and NAPT (about 4.5 KiB)
  ; whose only caller, APClass::enableNAPT, the firmware never uses.
  CONFIG_LWIP_IP_FORWARD=n
  ; The device never advertises or uses IPv6: the app reaches it over the
  ; BLE-delivered IPv4 baseUrl, and mDNS stays on IPv4.
  CONFIG_LWIP_IPV6=n
  CONFIG_LWIP_IPV4_NAPT=n
build_flags =
  ${env:WAVESHARE_AMOLED_175_POWER_METRICS.build_flags}
  -DAUTOMATIC_LIGHT_SLEEP_EXPERIMENT=1

[env:WAVESHARE_AMOLED_175_USB_RECOVERY_VALIDATION]
extends = env:WAVESHARE_AMOLED_175_PRODUCTION
build_flags =
  ${env:WAVESHARE_AMOLED_175_PRODUCTION.build_flags}
  -DUSB_RECOVERY_STATUS=1

[env:WAVESHARE_AMOLED_175_PRODUCTION]
extends = waveshare_amoled_175_base
custom_sdkconfig =
  ${waveshare_amoled_175_base.custom_sdkconfig}
  ; Production silences every ESP_LOGx tag at runtime (setup() calls
  ; esp_log_level_set("*", ESP_LOG_NONE)) and has no log sink, so compile the
  ; calls out as well: their format strings, the Wi-Fi library's error strings
  ; and the call-site code leave the image (about 100 KiB). Diagnostics
  ; profiles keep the Arduino default (errors) for their serial output.
  ; Kconfig choices need the Arduino default member switched off explicitly
  ; (as for CONFIG_BT_NIMBLE_MEM_ALLOC_MODE above); two members set to y keep
  ; the original selection.
  CONFIG_LOG_DEFAULT_LEVEL_ERROR=n
  CONFIG_LOG_DEFAULT_LEVEL_NONE=y
  CONFIG_LOG_MAXIMUM_EQUALS_DEFAULT=y
build_unflags =
  ${waveshare_amoled_common.build_unflags}
build_flags =
  ${waveshare_amoled_175_base.build_flags}
  -DCORE_DEBUG_LEVEL=0
  -DFIRMWARE_DIAGNOSTICS=0
  ; Stable camera/orientation passed the source and size gates and is now part
  ; of the production map capability. World Radio remains diagnostics-only.
  -DMAP_STABLE_CAMERA=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Explicit production rollout: keep the bounded RAUT detector/control path
  ; active so Watch GPS can drive Ask-to-Start and automatic pause/resume.
  ; Automatic-start mode remains separately rollout-gated in the app.
  -DRIDE_AUTOMATION_SHADOW=1
  -DRIDE_AUTOMATION_INTERNAL_CONTROL=1
  ; Keep persistent ride diagnostics, but compile out the developer-only
  ; detailed capture lease to stay inside the dual-OTA application slot.
  -DDETAILED_RIDE_DIAGNOSTICS=0

[env:WAVESHARE_AMOLED_175_LIFECYCLE_QUALIFICATION]
; NONSHIPPING: production behavior and dual-OTA layout, with the pending
; lifecycle protocols enabled only for exact-candidate build/physical gates.
; Never a factory/release artifact; no browser service or development signer.
extends = env:WAVESHARE_AMOLED_175_PRODUCTION
build_flags =
  ${env:WAVESHARE_AMOLED_175_PRODUCTION.build_flags}
  -DMAP_OPERATIONS_V1_ENABLED=1
  -DFIRMWARE_OPERATIONS_V1_ENABLED=1

; Owner-only USB build with production behavior and both production and
; development map trust. This distinct profile is never a factory/OTA release
; artifact. The normal production profile remains production-trust-only.
[env:WAVESHARE_AMOLED_175_PERSONAL]
extends = env:WAVESHARE_AMOLED_175_PRODUCTION
build_flags =
  ${env:WAVESHARE_AMOLED_175_PRODUCTION.build_flags}
  -DMAP_STREAM_DEVELOPMENT_TRUST=1

; NONSHIPPING: qualify enabled Nearby with production behavior, the existing
; lifecycle adapters, dual 4 MiB OTA slots and the 64 KiB application reserve.
; No remote debug service or development signer; never factory/release output.
[env:WAVESHARE_AMOLED_175_POI_LIFECYCLE_QUALIFICATION]
extends = env:WAVESHARE_AMOLED_175_LIFECYCLE_QUALIFICATION
build_flags =
  ${env:WAVESHARE_AMOLED_175_LIFECYCLE_QUALIFICATION.build_flags}
  -DMAP_POIS_RUNTIME_ENABLED=1

; NONSHIPPING, owner-approved isolated map qualification only. Keep the same
; production behavior, dual 4 MiB slots and 64 KiB reserve; add only the public
; qualification signer. Never select this profile in factory/release output.
[env:WAVESHARE_AMOLED_175_POI_ISOLATED_LIFECYCLE_QUALIFICATION]
extends = env:WAVESHARE_AMOLED_175_POI_LIFECYCLE_QUALIFICATION
build_flags =
  ${env:WAVESHARE_AMOLED_175_POI_LIFECYCLE_QUALIFICATION.build_flags}
  -DMAP_STREAM_QUALIFICATION_TRUST=1

[env:WAVESHARE_AMOLED_175_DISPLAY_TEST]
extends = env:WAVESHARE_AMOLED_175
build_flags =
  ${env:WAVESHARE_AMOLED_175.build_flags}
  -DWAVESHARE_DISPLAY_TEST=1

[env:WAVESHARE_AMOLED_175_IMU_DIAGNOSTICS]
extends = env:WAVESHARE_AMOLED_175
build_flags =
  ${env:WAVESHARE_AMOLED_175.build_flags}
  -DWAVESHARE_IMU_DIAGNOSTICS=1

[env:WAVESHARE_AMOLED_175_TOUCH_DIAGNOSTICS]
extends = env:WAVESHARE_AMOLED_175
build_flags =
  ${env:WAVESHARE_AMOLED_175.build_flags}
  -DWAVESHARE_TOUCH_DIAGNOSTICS=1

[env:WAVESHARE_AMOLED_175_MAPIO_DIAGNOSTICS]
extends = env:WAVESHARE_AMOLED_175
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${env:WAVESHARE_AMOLED_175.build_flags}
  -DWAVESHARE_MAPIO_TIMING_LOG=1

[env:WAVESHARE_AMOLED_175_SPEAKER_HONK]
extends = env:WAVESHARE_AMOLED_175
build_src_filter =
  -<*>
  +<../speaker_honk_test.cpp>

[waveshare_amoled_206_base]
extends = waveshare_amoled_common
custom_firmware_target = WAVESHARE_AMOLED_206
build_flags =
  ${waveshare_amoled_common.build_flags}
  -DWAVESHARE_AMOLED_206
  -DPERSISTENT_RIDE_DIAGNOSTICS=1
  ; One-way boot compatibility recovery for images that inherit the display
  ; enable bit cleared by older 2.06 firmware. The implementation may only set
  ; register 0x90 bit 0x80 and must preserve every other PMIC bit.
  -DWAVESHARE_206_FORCE_AXP_DISPLAY=1

[env:WAVESHARE_AMOLED_206]
extends = waveshare_amoled_206_base
; Match the 1.75-inch developer layout: one 8 MiB application slot with FFat
; at the production-compatible offset. Release firmware retains dual OTA slots.
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${waveshare_amoled_206_base.build_flags}
  -DCORE_DEBUG_LEVEL=2
  -DFIRMWARE_DIAGNOSTICS=1
  -DMAP_STABLE_CAMERA=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DRIDE_AUTOMATION_SHADOW=1
  -DRIDE_AUTOMATION_INTERNAL_CONTROL=1
  -DDETAILED_RIDE_DIAGNOSTICS=1
  -DRIDE_AUTOMATION_TRACE=1

[env:WAVESHARE_AMOLED_206_REMOTE_DEBUG]
extends = env:WAVESHARE_AMOLED_206
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${env:WAVESHARE_AMOLED_206.build_flags}
  -DDEVICE_REMOTE_DEBUG=1
  -DMAP_POIS_RUNTIME_ENABLED=1
  ; Public development map signer for Bicino Dev physical testing. Ordinary
  ; and production profiles remain production-trust-only.
  -DMAP_STREAM_DEVELOPMENT_TRUST=1

[env:WAVESHARE_AMOLED_206_POWER_METRICS]
extends = env:WAVESHARE_AMOLED_206
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${env:WAVESHARE_AMOLED_206.build_flags}
  -DPOWER_METRICS=1
  ; Set to a verified spare output pin when correlating source-monitor traces.
  ; -DPOWER_METRICS_PULSE_GPIO=XX

[env:WAVESHARE_AMOLED_206_LIGHT_SLEEP]
extends = env:WAVESHARE_AMOLED_206_POWER_METRICS
custom_sdkconfig =
  CONFIG_APP_COMPILE_TIME_DATE=n
  CONFIG_BOOTLOADER_COMPILE_TIME_DATE=n
  CONFIG_PM_ENABLE=y
  CONFIG_PM_DFS_INIT_AUTO=n
  CONFIG_PM_PROFILING=n
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_PM_LIGHT_SLEEP_CALLBACKS=y
  CONFIG_ESP_TASK_WDT_INIT=y
  CONFIG_ESP_TASK_WDT_PANIC=y
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=5
  CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=y
  CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1=n
  CONFIG_GPIO_CTRL_FUNC_IN_IRAM=y
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  CONFIG_ESP_IPC_TASK_STACK_SIZE=1536
  CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=98304
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_MEMTEST=y
  CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
  CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=n
  CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC=y
  CONFIG_MBEDTLS_CUSTOM_MEM_ALLOC=n
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_LWIP_PPP_SUPPORT=n
  ; Nothing routes between the device's access point and another network:
  ; the Arduino default compiles lwIP IP forwarding and NAPT (about 4.5 KiB)
  ; whose only caller, APClass::enableNAPT, the firmware never uses.
  CONFIG_LWIP_IP_FORWARD=n
  ; The device never advertises or uses IPv6: the app reaches it over the
  ; BLE-delivered IPv4 baseUrl, and mDNS stays on IPv4.
  CONFIG_LWIP_IPV6=n
  CONFIG_LWIP_IPV4_NAPT=n
build_flags =
  ${env:WAVESHARE_AMOLED_206_POWER_METRICS.build_flags}
  -DAUTOMATIC_LIGHT_SLEEP_EXPERIMENT=1

[env:WAVESHARE_AMOLED_206_USB_RECOVERY_VALIDATION]
extends = env:WAVESHARE_AMOLED_206_PRODUCTION
build_flags =
  ${env:WAVESHARE_AMOLED_206_PRODUCTION.build_flags}
  -DUSB_RECOVERY_STATUS=1

[env:WAVESHARE_AMOLED_206_PRODUCTION]
extends = waveshare_amoled_206_base
custom_sdkconfig =
  ${waveshare_amoled_206_base.custom_sdkconfig}
  ; Production silences every ESP_LOGx tag at runtime (setup() calls
  ; esp_log_level_set("*", ESP_LOG_NONE)) and has no log sink, so compile the
  ; calls out as well: their format strings, the Wi-Fi library's error strings
  ; and the call-site code leave the image (about 100 KiB). Diagnostics
  ; profiles keep the Arduino default (errors) for their serial output.
  ; Kconfig choices need the Arduino default member switched off explicitly
  ; (as for CONFIG_BT_NIMBLE_MEM_ALLOC_MODE above); two members set to y keep
  ; the original selection.
  CONFIG_LOG_DEFAULT_LEVEL_ERROR=n
  CONFIG_LOG_DEFAULT_LEVEL_NONE=y
  CONFIG_LOG_MAXIMUM_EQUALS_DEFAULT=y
build_unflags =
  ${waveshare_amoled_common.build_unflags}
build_flags =
  ${waveshare_amoled_206_base.build_flags}
  -DCORE_DEBUG_LEVEL=0
  -DFIRMWARE_DIAGNOSTICS=0
  ; Keep production map behavior symmetric across both Waveshare panels.
  -DMAP_STABLE_CAMERA=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Keep the production RAUT rollout symmetric with the 1.75-inch target.
  -DRIDE_AUTOMATION_SHADOW=1
  -DRIDE_AUTOMATION_INTERNAL_CONTROL=1
  ; Keep persistent ride diagnostics, but compile out the developer-only
  ; detailed capture lease to stay inside the dual-OTA application slot.
  -DDETAILED_RIDE_DIAGNOSTICS=0

[env:WAVESHARE_AMOLED_206_LIFECYCLE_QUALIFICATION]
; NONSHIPPING: production behavior and dual-OTA layout, with the pending
; lifecycle protocols enabled only for exact-candidate build/physical gates.
; Never a factory/release artifact; no browser service or development signer.
extends = env:WAVESHARE_AMOLED_206_PRODUCTION
build_flags =
  ${env:WAVESHARE_AMOLED_206_PRODUCTION.build_flags}
  -DMAP_OPERATIONS_V1_ENABLED=1
  -DFIRMWARE_OPERATIONS_V1_ENABLED=1

[env:WAVESHARE_AMOLED_206_PERSONAL]
extends = env:WAVESHARE_AMOLED_206_PRODUCTION
build_flags =
  ${env:WAVESHARE_AMOLED_206_PRODUCTION.build_flags}
  -DMAP_STREAM_DEVELOPMENT_TRUST=1

; Same nonshipping POI/lifecycle budget gate for the rectangular board.
[env:WAVESHARE_AMOLED_206_POI_LIFECYCLE_QUALIFICATION]
extends = env:WAVESHARE_AMOLED_206_LIFECYCLE_QUALIFICATION
build_flags =
  ${env:WAVESHARE_AMOLED_206_LIFECYCLE_QUALIFICATION.build_flags}
  -DMAP_POIS_RUNTIME_ENABLED=1

[env:WAVESHARE_AMOLED_206_DISPLAY_TEST]
extends = env:WAVESHARE_AMOLED_206
build_flags =
  ${env:WAVESHARE_AMOLED_206.build_flags}
  -DWAVESHARE_DISPLAY_TEST=1
  -DWAVESHARE_DISPLAY_PROBE=1

[env:WAVESHARE_AMOLED_206_IMU_DIAGNOSTICS]
extends = env:WAVESHARE_AMOLED_206
build_flags =
  ${env:WAVESHARE_AMOLED_206.build_flags}
  -DWAVESHARE_IMU_DIAGNOSTICS=1

[env:WAVESHARE_AMOLED_206_MAPIO_DIAGNOSTICS]
extends = env:WAVESHARE_AMOLED_206
board_build.partitions = partitions_remote_debug.csv
build_flags =
  ${env:WAVESHARE_AMOLED_206.build_flags}
  -DWAVESHARE_MAPIO_TIMING_LOG=1

[env:WAVESHARE_AMOLED_206_VENDOR_HELLO]
