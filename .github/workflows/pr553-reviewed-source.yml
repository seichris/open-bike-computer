name: PR 553 reviewed source objects
on:
  push:
    branches: [implement/wifi-device-operation-lifecycle]
    paths: [.github/workflows/pr553-reviewed-source.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'seichris/open-bike-computer' && github.ref == 'refs/heads/implement/wifi-device-operation-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9a04c14e32a2aea242c342e3004bd6de5e521561
          persist-credentials: false
      - name: Verify reviewed source and publish blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_0: 
          PATCH_1: 
          PATCH_2: 
          PATCH_3: 
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          REPO = 'seichris/open-bike-computer'
          BASE = '9a04c14e32a2aea242c342e3004bd6de5e521561'
          TREE = 'c8407a8e825b4df9a96b35e9da1dcf45ba6be6a5'
          def git(*args, data=None):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args], input=data)
          def api(path, value=None):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                  data=None if value is None else json.dumps(value).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='GET' if value is None else 'POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/implement/wifi-device-operation-lifecycle'
          assert [p['sha'] for p in api('git/commits/' + os.environ['GITHUB_SHA'])['parents']] == [BASE], 'Concurrent branch change; reconcile before publication'
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == 'b558158ad6d3b7b8e1ea9f3a891b806678fe8188'
          encoded = ''.join(os.environ['PATCH_' + str(i)] for i in range(4))
          assert len(encoded) == 28876
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=1024 * 1024)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 85644 and hashlib.sha256(patch).hexdigest() == '0939c91652a69ff51a2a2f0cf69017060b7dac801941a1d74087c4f2406d8874'
          git('apply', '--index', '--whitespace=error-all', '-', data=patch)
          assert git('write-tree').decode().strip() == TREE
          paths = git('diff', '--cached', '--name-only').decode().splitlines()
          assert len(paths) == 30
          assert all(not p.startswith('.github/workflows/') for p in paths)
          entries = []
          for path in paths:
              assert not path.startswith('/') and '..' not in path.split('/')
              mode, sha, stage = git('ls-files', '--stage', '--', path).decode().split('\t')[0].split()
              assert mode in ('100644', '100755') and stage == '0'
              payload = git('show', ':' + path)
              assert len(payload) < 2 * 1024 * 1024
              result = api('git/blobs', {'content': base64.b64encode(payload).decode(), 'encoding': 'base64'})
              assert result['sha'] == sha
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          # No execution of patched source; no tree, commit, ref, secret or
          # permission writes. The authorized connector publishes this tree
          # and removes this temporary workflow from the resulting source.
          result = {'tree': TREE, 'entries': entries, 'staging': os.environ['GITHUB_SHA']}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'source-objects.json').write_text(json.dumps(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-source-objects
          path: ${{ runner.temp }}/source-objects.json
          retention-days: 1
          if-no-files-found: error
