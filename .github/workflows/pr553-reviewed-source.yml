name: PR 553 reviewed source objects
on:
  push:
    branches: [implement/wifi-device-operation-lifecycle]
    paths: [.github/workflows/pr553-reviewed-source.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'seichris/open-bike-computer' && github.ref == 'refs/heads/implement/wifi-device-operation-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8869d1d192afb8a185debebf5e5ee940b76785c4
          persist-credentials: false
      - name: Verify reviewed source and publish blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH: 
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          REPO = 'seichris/open-bike-computer'
          BASE = '8869d1d192afb8a185debebf5e5ee940b76785c4'
          TREE = '6d6be18f180ee3e6220a98dd408c67220570bfcf'
          def git(*args, data=None):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args], input=data)
          def api(path, value=None):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                  data=None if value is None else json.dumps(value).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='GET' if value is None else 'POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/implement/wifi-device-operation-lifecycle'
          assert [p['sha'] for p in api('git/commits/' + os.environ['GITHUB_SHA'])['parents']] == [BASE]
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == 'c8407a8e825b4df9a96b35e9da1dcf45ba6be6a5'
          decoder = zlib.decompressobj()
          patch = decoder.decompress(base64.b64decode(os.environ['PATCH'], validate=True), 65536)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(patch) == 8856 and hashlib.sha256(patch).hexdigest() == '9cc645c963e97c03410202e0dad9047b164b6bcd1e9744b572d37fcc0c71af2d'
          git('apply', '--index', '--whitespace=error-all', '-', data=patch)
          assert git('write-tree').decode().strip() == TREE
          paths = git('diff', '--cached', '--name-only').decode().splitlines()
          assert len(paths) == 5 and all(not p.startswith('.github/') for p in paths)
          entries = []
          for path in paths:
              assert not path.startswith('/') and '..' not in path.split('/')
              mode, sha, stage = git('ls-files', '--stage', '--', path).decode().split('\t')[0].split()
              assert mode in ('100644', '100755') and stage == '0'
              payload = git('show', ':' + path)
              assert len(payload) < 2 * 1024 * 1024
              result = api('git/blobs', {'content': base64.b64encode(payload).decode(), 'encoding': 'base64'})
              assert result['sha'] == sha
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          # No patched code executes here. Native connector performs all tree,
          # commit and ref writes and removes this temporary workflow.
          result = {'tree': TREE, 'entries': entries, 'staging': os.environ['GITHUB_SHA']}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'source-objects.json').write_text(json.dumps(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-source-objects
          path: ${{ runner.temp }}/source-objects.json
          retention-days: 1
          if-no-files-found: error
