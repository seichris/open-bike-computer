name: PR 553 reviewed source objects
on:
  push:
    branches: [implement/wifi-device-operation-lifecycle]
    paths: [.github/workflows/pr553-reviewed-source.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'seichris/open-bike-computer' && github.ref == 'refs/heads/implement/wifi-device-operation-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6eef692407958999a4c967bc518b3c5b77fdccba
          persist-credentials: false
      - name: Verify exact patch and publish blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH: 
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          def git(*args, data=None):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args], input=data)
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == '17e64219d9454ffefed44001681b6f15299dce96'
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH'], validate=True))
          assert len(patch) < 65536 and hashlib.sha256(patch).hexdigest() == '69b261f8ae412a5ade2661cfc66ce7d37b6e7296ee362d5f063a766eb942b7b3'
          git('apply', '--index', '--whitespace=error-all', '-', data=patch)
          tree = git('write-tree').decode().strip()
          assert tree == 'b558158ad6d3b7b8e1ea9f3a891b806678fe8188'
          expected_paths = {'.github/workflows/ci.yml', 'ios-app/scripts/run-navigation-tests.sh', 'tools/tests/test_diagnostics_source_graph.py'}
          paths = git('diff', '--cached', '--name-only').decode().splitlines()
          assert set(paths) == expected_paths
          entries = []
          for path in paths:
              mode, sha, stage = git('ls-files', '--stage', '--', path).decode().split('\t')[0].split()
              assert mode in ('100644', '100755') and stage == '0'
              payload = git('show', ':' + path)
              request = urllib.request.Request('https://api.github.com/repos/seichris/open-bike-computer/git/blobs',
                  data=json.dumps({'content': base64.b64encode(payload).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert json.load(response)['sha'] == sha
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          # No tree, commit, ref, secret or permission writes. The authorized
          # connector commits this verified result and removes this helper.
          result = {'tree': tree, 'entries': entries, 'staging': os.environ['GITHUB_SHA']}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'source-objects.json').write_text(json.dumps(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-source-objects
          path: ${{ runner.temp }}/source-objects.json
          retention-days: 1
          if-no-files-found: error
