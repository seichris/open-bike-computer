name: Diagnostics source snapshot

on:
  push:
    branches:
      - implement/wifi-device-operation-lifecycle
    paths:
      - .github/workflows/diagnostics-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'seichris/open-bike-computer' && github.ref == 'refs/heads/implement/wifi-device-operation-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Archive staged diagnostics for independent review
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/pr-source.tar.gz" HEAD -- .github/diagnostics-reviewed
          (cd "$RUNNER_TEMP" && sha256sum pr-source.tar.gz > source-sha256.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
            ${{ runner.temp }}/source-sha256.txt
          retention-days: 1
          if-no-files-found: error
