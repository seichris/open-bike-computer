name: Firmware Diagnostic Builds

on:
  workflow_call:
    inputs:
      include_remote_debug:
        description: Build remote-debug when it is not already qualified by the caller
        type: boolean
        default: true
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.selection.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=""
          if test "$GITHUB_EVENT_NAME" = schedule; then
            previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/firmware-diagnostics.yml/runs?status=success&per_page=30" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty' || true)"
            python3 .github/scripts/diagnostic_changes.py "$previous" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  esp32-diagnostics:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ESP32 Diagnostic (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        exclude: ${{ fromJSON(inputs.include_remote_debug == false && github.event_name == 'push' && '[{"target":"WAVESHARE_AMOLED_175_REMOTE_DEBUG"},{"target":"WAVESHARE_AMOLED_206_REMOTE_DEBUG"}]' || '[]') }}
        target:
          - WAVESHARE_AMOLED_175_REMOTE_DEBUG
          - WAVESHARE_AMOLED_175_MAPIO_DIAGNOSTICS
          - WAVESHARE_AMOLED_175_DISPLAY_TEST
          - WAVESHARE_AMOLED_175_POWER_METRICS
          - WAVESHARE_AMOLED_175_LIGHT_SLEEP
          - WAVESHARE_AMOLED_206_REMOTE_DEBUG
          - WAVESHARE_AMOLED_206_MAPIO_DIAGNOSTICS
          - WAVESHARE_AMOLED_206_DISPLAY_TEST
          - WAVESHARE_AMOLED_206_POWER_METRICS
          - WAVESHARE_AMOLED_206_LIGHT_SLEEP
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore pinned PlatformIO downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: esp32/.pio/open-bike-build/downloads
          key: esp32-pinned-downloads-${{ runner.os }}-${{ hashFiles('esp32/tools/generated_sdkconfig.py') }}
      - name: Restore verified firmware build caches
        uses: ./.github/actions/firmware-build-cache
        with:
          environment: ${{ matrix.target }}
      - name: Build with the repository-owned firmware runtime
        run: env -u LD_LIBRARY_PATH python3 tools/build_firmware.py "${{ matrix.target }}"
      - name: Verify remote-debug artifact includes the browser service
        if: contains(matrix.target, '_REMOTE_DEBUG')
        run: |
          grep -aFq "/device-debug/" ".pio/build/${{ matrix.target }}/firmware.elf"
          grep -aFq "Bicino real-device debugger" ".pio/build/${{ matrix.target }}/firmware.elf"
      - name: Verify non-debug artifacts exclude remote-debug routes
        if: ${{ !contains(matrix.target, '_REMOTE_DEBUG') }}
        run: |
          if grep -aFq "/device-debug/" ".pio/build/${{ matrix.target }}/firmware.elf"; then
            echo "Non-debug firmware contains remote-debug routes"
            exit 1
          fi
