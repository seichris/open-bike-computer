name: Workout development validation
on:
  push:
    branches: [feat/iphone-owned-workouts]
    paths: [.github/workflows/workout-development-snapshot.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify and apply exact authored patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/iphone-owned-workouts
          test "$(git rev-parse HEAD^)" = fd5018549d25b447cf0475c86d6d264011f9b303
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          sha = '30a5c7aba0ff3ddd49cdb6399ea30a37910597c9'
          request = urllib.request.Request('https://api.github.com/repos/seichris/open-bike-computer/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          content = base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == sha
          patch = lzma.decompress(base64.b64decode(content, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '710c5bc388196bff343017508c69d42eed2eeb166a79ee728a1ad3c2cfbd017f'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'workout.patch'
          path.write_bytes(patch)
          for entry in subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True).splitlines():
              changed = entry.split('\t', 2)[2]
              assert changed.startswith('ios-app/') or changed == 'docs/iphone-owned-workouts.md', changed
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
      - name: Commit only to feature branch
        id: publish
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: initialize workout coordination on its actor before observing'
          git push origin HEAD:refs/heads/feat/iphone-owned-workouts
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  tests:
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Ownership and real coordinator integration
        run: ios-app/scripts/run-workout-recording-tests.sh
      - name: Workout contracts
        if: ${{ !cancelled() }}
        run: ios-app/scripts/run-workout-contract-tests.sh
      - name: Navigation and location regression tests
        if: ${{ !cancelled() }}
        run: ios-app/scripts/run-navigation-tests.sh
      - name: Packaging tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s ios-app/scripts/tests
  build:
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Build iPhone, Watch and extensions
        working-directory: ios-app
        run: |
          ./scripts/xcodebuild-cli.sh -project BikeComputer/BikeComputer.xcodeproj -scheme BikeComputer -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/workout-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/workout-build.log" 2>&1 || {
            grep -B3 -A8 -E 'error:|BUILD FAILED' "$RUNNER_TEMP/workout-build.log" || true
            exit 1
          }
          tail -20 "$RUNNER_TEMP/workout-build.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workout-native-build-log
          path: ${{ runner.temp }}/workout-build.log
          retention-days: 1
