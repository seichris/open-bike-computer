name: Workout development validation
on:
  push:
    branches: [feat/iphone-owned-workouts]
    paths: [.github/workflows/workout-development-snapshot.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify and apply test-only patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/iphone-owned-workouts
          test "$(git rev-parse HEAD^)" = e1d1c8befc8b630a59f921412116350c30ad4c58
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          sha = '12fd4059209dc68c509b5af048302b6cc7ad295b'
          request = urllib.request.Request('https://api.github.com/repos/seichris/open-bike-computer/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              content = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == sha
          patch = lzma.decompress(base64.b64decode(content, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '45e82523c288d88e9570a236d38f4ce0bdb5fcb992a119d300667566ee86043d'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'workout.patch'
          path.write_bytes(patch)
          for entry in subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True).splitlines():
              assert entry.split('\t', 2)[2] == 'ios-app/BikeComputerTests/WorkoutSessionCoordinatorTests.swift'
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
      - name: Commit only to feature branch
        id: publish
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: use chronological Watch sessions and assert fixture admission'
          git push origin HEAD:refs/heads/feat/iphone-owned-workouts
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  tests:
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Ownership, coordinator and existing workout contracts
        run: ios-app/scripts/run-workout-contract-tests.sh
