name: Temporary offline-route native regression validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  apply:
    if: github.head_ref == 'feat/planned-routes-save-offline' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: apply
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/offline-route-native-fixes.patch"
          cp .github/offline-route-native-fixes.patch "$patch"
          echo "b7ec86e54aef7edd78f1f10831fe8f3a2f245e34fcc64cf6328eddb08ab7a7ac  $patch" | sha256sum --check
          git rm .github/workflows/offline-route-native-validation.yml .github/offline-route-native-fixes.patch
          test "$(git write-tree)" = '6a6e66015e83a76d55b4da7ff23c97ef6664da4f'
          git apply --index "$patch"
          test "$(git write-tree)" = '39d60d1c50890e135227b8476d28b566532c79ae'
          git diff --cached --check
          git restore --source=HEAD --staged --worktree .github/workflows/offline-route-native-validation.yml .github/offline-route-native-fixes.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ios): host offline save confirmation at the stable Settings root'
          git push origin HEAD:refs/heads/feat/planned-routes-save-offline
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    name: Native ${{ matrix.check }}
    needs: apply
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [navigation, saved-route-map, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - name: Verify exact clean feature tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/offline-route-native-validation.yml .github/offline-route-native-fixes.patch
          test "$(git write-tree)" = '39d60d1c50890e135227b8476d28b566532c79ae'
          mkdir -p "$RUNNER_TEMP/offline-route-validation"
          { git rev-parse HEAD; git write-tree; xcrun swiftc --version; } | tee "$RUNNER_TEMP/offline-route-validation/source.txt"
      - name: Run requested check
        working-directory: ios-app
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/offline-route-validation/$CHECK.log"
          case "$CHECK" in
            navigation) ./scripts/run-navigation-tests.sh 2>&1 | tee "$log" ;;
            saved-route-map) ./scripts/run-saved-route-map-tests.sh 2>&1 | tee "$log" ;;
            build) ./scripts/xcodebuild-cli.sh -project BikeComputer/BikeComputer.xcodeproj -scheme BikeComputer -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$log" ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-route-verified-${{ matrix.check }}
          path: ${{ runner.temp }}/offline-route-validation
          retention-days: 7
