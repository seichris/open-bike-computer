name: Validate PR444 workout summary contract
on:
  push:
    branches: [codex/pr444-ci-contract-validation]
    paths: [.github/workflows/pr444-ci-contract-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ba868dc9b33b2e50d4484400eb4dc60e147bf282
      - name: Reproduce exactly the reported source-contract failure
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ba868dc9b33b2e50d4484400eb4dc60e147bf282
          if bash ios-app/scripts/run-workout-contract-tests.sh > "$RUNNER_TEMP/before.log" 2>&1; then
            echo 'Expected the reported regression to fail before the correction'
            exit 1
          fi
          cat "$RUNNER_TEMP/before.log"
          grep -Fq 'FAIL: Watch takeover copy must remain bound to the live and terminal Save/Discard dispositions' "$RUNNER_TEMP/before.log"
          test "$(grep -c '^FAIL:' "$RUNNER_TEMP/before.log")" -eq 1
          grep -Fq 'Workout contract tests failed: 1' "$RUNNER_TEMP/before.log"
      - name: Correct and strengthen the saved versus discarded summary contract
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from textwrap import dedent, indent
          path = Path('ios-app/BikeComputerTests/WorkoutContractTests.swift')
          data = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob == '9bb2acb42600bef5ea63e429bba77900829679a8', blob
          source = data.decode()
          message = '"Watch takeover copy must remain bound to the live and terminal Save/Discard dispositions"'
          assert source.count(message) == 1
          message_index = source.index(message)
          start = source.rfind('        expect(', 0, message_index)
          end = source.index('\n        )', message_index) + len('\n        )')
          old = source[start:end]
          assert 'WorkoutCrossAppTakeoverCopyV1.live(disposition:manager.isDiscarding?.discard:.save)' in old
          assert 'WorkoutCrossAppTakeoverCopyV1.summary(disposition:summary.outcome==.saved?.save:.discard)' in old
          replacement = indent(dedent(r'''
          expect(
              compactLiveWatchView.contains(
                  "WorkoutCrossAppTakeoverCopyV1.live(disposition:manager.isDiscarding?.discard:.save)"
              ),
              "Watch live takeover copy must follow the active Save/Discard disposition"
          )
          // Discard is now a progress-only branch which the root dismisses after
          // safe cleanup. Only saved rides enter the interactive summary below.
          // Keep the branch check separate so a save-only copy assertion cannot
          // accidentally permit the old post-discard recovery screen to return.
          expect(
              compactSummaryWatchView.contains(
                  "ifsummary.outcome==.discarded{ProgressView(\"Discarding…\").font(.caption).accessibilityIdentifier(\"workout-discard-progress\")}else{savedSummary}"
              ),
              "Watch discarded summary must show only automatic progress, without recovery actions"
          )
          expect(
              compactSummaryWatchView.contains("privatevarsavedSummary:someView{")
                  && compactSummaryWatchView.contains(
                      "ifsummary.terminalErrorCode==.anotherWorkoutActive{Label(WorkoutCrossAppTakeoverCopyV1.summary(disposition:.save),"
                  ),
              "Watch saved summary must retain the save-specific cross-app takeover warning"
          )
          ''').strip('\n'), '        ')
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          print('Updated contract SHA256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          git diff --check
          git diff --stat
          git diff -- ios-app/BikeComputerTests/WorkoutContractTests.swift
      - name: Run the complete native Swift workout contract suite
        run: bash ios-app/scripts/run-workout-contract-tests.sh
      - name: Verify the new guards reject save warning and discard UI regressions
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          path = Path('ios-app/BikeComputer/BikeComputerWatch/Views/WorkoutSummaryView.swift')
          original = path.read_text()
          mutations = [
              ('disposition: .save', 'disposition: .discard', 'Watch saved summary must retain the save-specific cross-app takeover warning'),
              ('ProgressView("Discarding…")', 'ProgressView("Discarding…")\n                Button("Retry Recovery", action: onRetryCleanup)', 'Watch discarded summary must show only automatic progress, without recovery actions'),
          ]
          try:
              for before, after, failure in mutations:
                  assert original.count(before) == 1
                  path.write_text(original.replace(before, after))
                  result = subprocess.run(['bash', 'ios-app/scripts/run-workout-contract-tests.sh'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(result.stdout)
                  assert result.returncode != 0, 'Mutation unexpectedly passed'
                  assert 'FAIL: ' + failure in result.stdout
          finally:
              path.write_text(original)
          PY
          git diff --check
      - name: Publish the test-only candidate commit, never main or the PR branch
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = ios-app/BikeComputerTests/WorkoutContractTests.swift
          git add ios-app/BikeComputerTests/WorkoutContractTests.swift
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Align Watch summary contracts with automatic discard completion'
          git push origin HEAD:refs/heads/codex/pr444-ci-contract-validated
          git show --stat --oneline HEAD
          git rev-parse HEAD
