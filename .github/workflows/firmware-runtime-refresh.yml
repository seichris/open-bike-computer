name: Firmware runtime refresh candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-runtime-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64-cp313
          - runner: macos-15
            target: macos-arm64-cp313
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Require a clean exact generator checkout
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Load the reviewed runtime publication identity
        run: |
          publication="$(env -u LD_LIBRARY_PATH PYTHONPATH=tools python tools/firmware_runtime_publication.py identity)"
          echo "RUNTIME_LOCK_SET_ID=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["lockSetId"])' "$publication")" >> "$GITHUB_ENV"
          echo "RUNTIME_RELEASE_TAG=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["releaseTag"])' "$publication")" >> "$GITHUB_ENV"
      - name: Validate host and tracked inputs
        run: |
          test "$(uname -m)" = "$(test '${{ matrix.target }}' = linux-x86_64-cp313 && echo x86_64 || echo arm64)"
          env -u LD_LIBRARY_PATH PYTHONPATH=tools python -m unittest \
            tools.tests.test_build_firmware \
            tools.tests.test_firmware_runtime \
            tools.tests.test_firmware_profile_config \
            tools.tests.test_generated_sdkconfig \
            tools.tests.test_pioarduino_custom_core \
            tools.tests.test_refresh_firmware_runtime
          mkdir -p runtime-candidate-a runtime-candidate-b
          env -u LD_LIBRARY_PATH python tools/refresh_firmware_runtime.py inspect-inputs \
            > runtime-candidate-a/inputs.json
      - name: Build independent candidate A
        run: |
          env -u LD_LIBRARY_PATH python tools/refresh_firmware_runtime.py build-candidate \
            --target "${{ matrix.target }}" \
            --output-dir runtime-candidate-a \
            --release-tag "${RUNTIME_RELEASE_TAG}" \
            > runtime-candidate-a/build.json
      - name: Build independent candidate B
        run: |
          env -u LD_LIBRARY_PATH python tools/refresh_firmware_runtime.py build-candidate \
            --target "${{ matrix.target }}" \
            --output-dir runtime-candidate-b \
            --release-tag "${RUNTIME_RELEASE_TAG}" \
            > runtime-candidate-b/build.json
      - name: Require byte-identical clean rebuilds
        run: |
          for name in \
            "open-bike-firmware-runtime-${{ matrix.target }}.tar.gz" \
            "contract-${{ matrix.target }}.json" \
            "evidence-${{ matrix.target }}.json" \
            "licenses-${{ matrix.target }}.json"; do
            cmp "runtime-candidate-a/${name}" "runtime-candidate-b/${name}"
          done
      - name: Replay nested environments offline with an empty cache
        run: |
          env -u LD_LIBRARY_PATH python tools/refresh_firmware_runtime.py verify-candidate \
            --target "${{ matrix.target }}" \
            --output-dir runtime-candidate-a \
            > "runtime-candidate-a/offline-replay-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: firmware-runtime-candidate-${{ matrix.target }}
          path: |
            esp32/runtime-candidate-a/*.json
            esp32/runtime-candidate-a/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  firmware-build-validation:
    name: Firmware build validation (${{ matrix.target }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64-cp313
          - runner: macos-15
            target: macos-arm64-cp313
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Require a clean exact validation checkout
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Load the reviewed runtime publication identity
        run: |
          publication="$(env -u LD_LIBRARY_PATH PYTHONPATH=tools python tools/firmware_runtime_publication.py identity)"
          echo "RUNTIME_LOCK_SET_ID=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["lockSetId"])' "$publication")" >> "$GITHUB_ENV"
          echo "RUNTIME_RELEASE_TAG=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["releaseTag"])' "$publication")" >> "$GITHUB_ENV"
      - name: Configure the isolated runtime cache
        run: echo "OPEN_BIKE_FIRMWARE_RUNTIME_CACHE=$RUNNER_TEMP/firmware-runtime-cache" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firmware-runtime-candidate-*
          path: ${{ runner.temp }}/runtime-candidates
      - name: Assemble the reviewed dual-host lock
        run: |
          candidates="$RUNNER_TEMP/runtime-candidates"
          env -u LD_LIBRARY_PATH python tools/refresh_firmware_runtime.py assemble-lock \
            --output tools/firmware-runtime/lock-v1.json \
            --lock-set-id "${RUNTIME_LOCK_SET_ID}" \
            --contract "$candidates/firmware-runtime-candidate-linux-x86_64-cp313/contract-linux-x86_64-cp313.json" \
            --contract "$candidates/firmware-runtime-candidate-macos-arm64-cp313/contract-macos-arm64-cp313.json"

          git config user.name "Open Bike Runtime Refresh"
          git config user.email "runtime-refresh@open-bike-computer.invalid"
          source_date="$(git show -s --format=%cI HEAD)"
          git add tools/firmware-runtime/lock-v1.json
          GIT_AUTHOR_DATE="$source_date" GIT_COMMITTER_DATE="$source_date" \
            git commit -m "Validate accepted firmware runtime candidate"
          test -z "$(git status --porcelain)"
      - name: Seed the exact host bundle into the isolated cache
        run: |
          candidate="$RUNNER_TEMP/runtime-candidates/firmware-runtime-candidate-${{ matrix.target }}"
          contract="$candidate/contract-${{ matrix.target }}.json"
          bundle="$candidate/open-bike-firmware-runtime-${{ matrix.target }}.tar.gz"
          digest="$(env -u LD_LIBRARY_PATH python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"]["bundle"]["sha256"])' "$contract")"
          size="$(env -u LD_LIBRARY_PATH python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"]["bundle"]["size"])' "$contract")"
          env -u LD_LIBRARY_PATH python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); assert p.stat().st_size == int(sys.argv[2]); assert hashlib.sha256(p.read_bytes()).hexdigest() == sys.argv[3]' \
            "$bundle" "$size" "$digest"
          destination="$OPEN_BIKE_FIRMWARE_RUNTIME_CACHE/locks/${RUNTIME_LOCK_SET_ID}/${{ matrix.target }}"
          mkdir -p "$destination"
          cp "$bundle" "$destination/$digest.tar.gz"
      - name: Prove clean and warm firmware builds
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/firmware-build-evidence"
          mkdir -p "$evidence"
          for environment in WAVESHARE_AMOLED_175 WAVESHARE_AMOLED_206; do
            env -u LD_LIBRARY_PATH python3 tools/build_firmware.py "$environment" \
              2>&1 | tee "$evidence/${environment}-clean.log"
            cp ".pio/open-bike-build/builds/$environment/current.json" \
              "$evidence/${environment}-clean-build-manifest.json"
            grep '^FIRMWARE_BUILD_PROVENANCE ' "$evidence/${environment}-clean.log" \
              | grep 'uploadEligible=1' \
              | grep 'runtimeTarget=${{ matrix.target }}' \
              | grep -E 'runtimePioarduinoPenvTreeSha256=[0-9a-f]{64}' \
              | grep -E 'runtimeEspIdfVenvTreeSha256=[0-9a-f]{64}' \
              | grep -E 'runtimeTransformedPlatformTreeSha256=[0-9a-f]{64}' \
              >> "$evidence/provenance.txt"

            env -u LD_LIBRARY_PATH HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 NO_PROXY= python3 tools/build_firmware.py "$environment" \
              2>&1 | tee "$evidence/${environment}-warm.log"
            cp ".pio/open-bike-build/builds/$environment/current.json" \
              "$evidence/${environment}-warm-build-manifest.json"
            grep '^FIRMWARE_BUILD_PROVENANCE ' "$evidence/${environment}-warm.log" \
              | grep 'uploadEligible=1' \
              | grep 'runtimeTarget=${{ matrix.target }}' \
              | grep -E 'runtimePioarduinoPenvTreeSha256=[0-9a-f]{64}' \
              | grep -E 'runtimeEspIdfVenvTreeSha256=[0-9a-f]{64}' \
              | grep -E 'runtimeTransformedPlatformTreeSha256=[0-9a-f]{64}' \
              >> "$evidence/provenance.txt"
            env -u LD_LIBRARY_PATH python -c 'import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); keys=("sourceIdentity","sourceDateEpoch","buildTimestamp","firmwareBinSha256","firmwareElfSha256","bootloaderBinSha256","partitionTableBinSha256","bootApp0Sha256","flashPlanSha256","coreAttestationSha256","runtimeProvenance"); assert all(a.get(k) == b.get(k) for k in keys)' \
              "$evidence/${environment}-clean-build-manifest.json" \
              "$evidence/${environment}-warm-build-manifest.json"
          done
      - name: Bind both production factory bundles to the candidate runtime
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" != "linux-x86_64-cp313" ]; then
            echo "Factory packaging is validated once on the Linux release host"
            exit 0
          fi
          evidence="$RUNNER_TEMP/firmware-build-evidence"
          lock="tools/firmware-runtime/lock-v1.json"
          for factory_target in WAVESHARE_AMOLED_175 WAVESHARE_AMOLED_206; do
            environment="${factory_target}_PRODUCTION"
            output="$evidence/factory-${factory_target}"
            env -u LD_LIBRARY_PATH python3 tools/build_firmware.py "$environment" \
              --factory-output-dir "$output" \
              2>&1 | tee "$evidence/${environment}.log"
            extract="$evidence/extract-${factory_target}"
            mkdir -p "$extract"
            tar -xzf "$output/${factory_target}.factory.tar.gz" -C "$extract"
            (cd "$extract/${factory_target}.factory" && sha256sum --check SHA256SUMS)
            env -u LD_LIBRARY_PATH python - \
              "$lock" \
              "$output/${factory_target}.factory-bundle.json" \
              "$extract/${factory_target}.factory/attestation/build-manifest.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          lock_path, descriptor_path, build_path = map(pathlib.Path, sys.argv[1:])
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          descriptor = json.loads(descriptor_path.read_text(encoding="utf-8"))
          build = json.loads(build_path.read_text(encoding="utf-8"))
          runtime = descriptor["runtimeAttestation"]
          target = next(item for item in lock["targets"] if item["id"] == runtime["target"])
          canonical_runtime = json.dumps(
              build["runtimeProvenance"], sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          assert runtime["lockSetId"] == lock["lockSetId"]
          assert runtime["manifestSha256"] == hashlib.sha256(lock_path.read_bytes()).hexdigest()
          assert runtime["bundleSha256"] == target["bundle"]["sha256"]
          assert runtime["runtimeProvenanceSha256"] == hashlib.sha256(canonical_runtime).hexdigest()
          PY
          done
      - name: Prove runtime tampering fails before PlatformIO
        run: |
          evidence="$RUNNER_TEMP/firmware-build-evidence"
          contract="$RUNNER_TEMP/runtime-candidates/firmware-runtime-candidate-${{ matrix.target }}/contract-${{ matrix.target }}.json"
          digest="$(env -u LD_LIBRARY_PATH python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"]["bundle"]["sha256"])' "$contract")"
          shared="$OPEN_BIKE_FIRMWARE_RUNTIME_CACHE/locks/${RUNTIME_LOCK_SET_ID}/${{ matrix.target }}/$digest"
          chmod u+w "$shared/bin/pio"
          printf '\n' >> "$shared/bin/pio"

          set +e
          env -u LD_LIBRARY_PATH python3 tools/build_firmware.py WAVESHARE_AMOLED_175 \
            > "$evidence/runtime-tamper.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep 'accepted runtime member changed: bin/pio' \
            "$evidence/runtime-tamper.log"
          if grep -q '=== PlatformIO real-target build' \
            "$evidence/runtime-tamper.log"; then
            echo "tampered runtime reached PlatformIO" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: firmware-build-validation-${{ matrix.target }}
          path: ${{ runner.temp }}/firmware-build-evidence
          if-no-files-found: error
          retention-days: 14

  review-summary:
    name: Canonical refresh review summary
    needs:
      - candidate
      - firmware-build-validation
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firmware-runtime-candidate-*
          path: ${{ runner.temp }}/runtime-candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firmware-build-validation-*
          path: ${{ runner.temp }}/firmware-validation
      - name: Assemble the proposed lock and obtain baseline licenses
        working-directory: esp32
        run: |
          set -euo pipefail
          publication="$(env -u LD_LIBRARY_PATH PYTHONPATH=tools python tools/firmware_runtime_publication.py identity)"
          candidate_lock_set="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["lockSetId"])' "$publication")"
          candidates="$RUNNER_TEMP/runtime-candidates"
          env -u LD_LIBRARY_PATH python tools/refresh_firmware_runtime.py assemble-lock \
            --output "$RUNNER_TEMP/candidate-lock.json" \
            --lock-set-id "$candidate_lock_set" \
            --contract "$candidates/firmware-runtime-candidate-linux-x86_64-cp313/contract-linux-x86_64-cp313.json" \
            --contract "$candidates/firmware-runtime-candidate-macos-arm64-cp313/contract-macos-arm64-cp313.json"
          baseline_lock_set="$(python -c 'import json; print(json.load(open("tools/firmware-runtime/lock-v1.json"))["lockSetId"])')"
          mkdir -p "$RUNNER_TEMP/baseline-licenses"
          gh release download "$baseline_lock_set" \
            --pattern 'licenses-*.json' \
            --dir "$RUNNER_TEMP/baseline-licenses"
      - name: Generate the canonical cross-target review artifact
        working-directory: esp32
        run: |
          env -u LD_LIBRARY_PATH PYTHONPATH=tools python \
            tools/firmware_runtime_review_summary.py \
            --baseline-lock tools/firmware-runtime/lock-v1.json \
            --candidate-lock "$RUNNER_TEMP/candidate-lock.json" \
            --baseline-license-dir "$RUNNER_TEMP/baseline-licenses" \
            --candidate-root "$RUNNER_TEMP/runtime-candidates" \
            --validation-root "$RUNNER_TEMP/firmware-validation" \
            --output "$RUNNER_TEMP/firmware-runtime-review-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-runtime-review-summary
          path: ${{ runner.temp }}/firmware-runtime-review-summary.json
          if-no-files-found: error
          retention-days: 90
