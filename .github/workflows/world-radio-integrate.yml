name: World Radio integration

on:
  push:
    branches:
      - feature/world-radio-screen

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[world-radio-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/world-radio-screen
      - name: Apply integration patch
        run: |
          python3 tools/apply_world_radio_integration.py
          python3 tools/generate_ride_ble_contract.py
          python3 tools/generate_ride_ble_contract.py --check
      - name: Run focused firmware host tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 esp32/tools/tests/test_world_radio_protocol.cpp -o /tmp/test-world-radio
          /tmp/test-world-radio
          g++ -std=c++17 esp32/tools/tests/test_main_screen_registry.cpp -o /tmp/test-screen-registry
          /tmp/test-screen-registry
          g++ -std=c++17 esp32/tools/tests/test_device_screen_protocol.cpp -o /tmp/test-device-screen
          /tmp/test-device-screen
          g++ -std=c++17 esp32/tools/tests/test_device_capabilities_protocol.cpp -o /tmp/test-capabilities
          /tmp/test-capabilities
      - name: Build both Waveshare firmware profiles
        working-directory: esp32
        run: |
          python3 tools/build_firmware.py WAVESHARE_AMOLED_175
          python3 tools/build_firmware.py WAVESHARE_AMOLED_206
      - name: Commit integrated source
        run: |
          rm -f .github/workflows/world-radio-integrate.yml
          rm -f tools/apply_world_radio_integration.py
          rm -f tools/world-radio-probe.txt tools/world-radio-probe2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[world-radio-integrated] feat: add iPhone-powered World Radio screen"
          git push origin HEAD:feature/world-radio-screen

  ios:
    needs: integrate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/world-radio-screen
      - name: Run iOS host tests
        working-directory: ios-app
        run: ./scripts/run-navigation-tests.sh
      - name: Build iOS app
        working-directory: ios-app
        run: |
          ./scripts/xcodebuild-cli.sh \
            -project BikeComputer/BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
