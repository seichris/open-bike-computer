name: Workout follow-up source snapshot
on:
  push:
    branches: [codex/workout-followup-source-snapshot]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lvgl/lvgl
          ref: 7f07a129e8d77f4984fff8e623fd5be18ff42e74
          persist-credentials: false
      - name: Archive pinned LVGL source for local host rendering
        run: |
          test "$(git rev-parse HEAD)" = 7f07a129e8d77f4984fff8e623fd5be18ff42e74
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/lvgl-9.2.2-source.tar.gz"
          sha256sum "$RUNNER_TEMP/lvgl-9.2.2-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lvgl-9.2.2-source
          path: ${{ runner.temp }}/lvgl-9.2.2-source.tar.gz
          retention-days: 1
          if-no-files-found: error
