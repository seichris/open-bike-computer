name: CI

on:
  workflow_call:
    inputs:
      scope:
        description: CI component to run
        required: false
        default: all
        type: string
      firmware_hardware:
        description: Firmware hardware families to build
        required: false
        default: "175"
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      scope:
        description: CI component to run
        required: true
        default: all
        type: choice
        options:
          - all
          - firmware
          - ios
          - map
      firmware_hardware:
        description: Firmware hardware families to build
        required: true
        default: "175"
        type: choice
        options:
          - "175"
          - "206"
          - "397"
          - all

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}-${{ inputs.scope || 'auto' }}-${{
    inputs.firmware_hardware || '175' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI components
    runs-on: ubuntu-latest
    outputs:
      firmware_build: ${{ steps.components.outputs.firmware_build }}
      firmware_host: ${{ steps.components.outputs.firmware_host }}
      firmware_targets: ${{ steps.components.outputs.firmware_targets }}
      firmware_host_checks: ${{ steps.components.outputs.firmware_host_checks }}
      firmware_renderer: ${{ steps.components.outputs.firmware_renderer }}
      zone_contracts: ${{ steps.components.outputs.zone_contracts }}
      heavy_ci: ${{ steps.policy.outputs.heavy_ci }}
      ios: ${{ steps.components.outputs.ios }}
      ios_native: ${{ steps.components.outputs.ios_native }}
      map_backend: ${{ steps.components.outputs.map_backend }}
      osm: ${{ steps.components.outputs.osm }}
      map_source: ${{ steps.components.outputs.map_source }}
      map_catalog: ${{ steps.components.outputs.map_catalog }}
      map_social: ${{ steps.components.outputs.map_social }}
      map_readers: ${{ steps.components.outputs.map_readers }}
      map_deploy: ${{ steps.components.outputs.map_deploy }}
      ios_checks: ${{ steps.components.outputs.ios_checks }}
      ios_simulator: ${{ steps.components.outputs.ios_simulator }}
      ios_release: ${{ steps.components.outputs.ios_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -shellcheck=
      - name: Test CI component routing
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Validate development check registry and isolation
        run: python3 tools/dev_check.py --check development-tools --report "$RUNNER_TEMP/dev-checks/development-tools/results.json"
      - name: Verify generated ride BLE contract
        run: python3 tools/generate_ride_ble_contract.py --check
      - id: policy
        name: Select CI cost policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          heavy_ci=true
          if test "$EVENT_NAME" = pull_request && test "$PULL_REQUEST_DRAFT" = true; then
            heavy_ci=false
          fi
          echo "heavy_ci=${heavy_ci}" >> "$GITHUB_OUTPUT"
      - name: Verify generated diagnostics contract
        run: python3 tools/generate_diagnostics_contract.py --check
      - name: Validate the protected partial gate scope
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.scope == 'map' &&
          (github.ref == 'refs/heads/deploy/map-platform-production' ||
          github.ref == 'refs/heads/deploy/map-platform-development')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/deploy/map-platform-production)
              deployment_lock=map-platform/deploy/compose.yaml
              ;;
            refs/heads/deploy/map-platform-development)
              deployment_lock=map-platform/deploy/compose.development.yaml
              ;;
            *)
              echo "::error::Unsupported protected promotion branch"
              exit 1
              ;;
          esac
          default_ref="origin/${DEFAULT_BRANCH}"
          if ! git diff --quiet "$default_ref...$GITHUB_SHA" -- \
            . ":(exclude)${deployment_lock}"; then
            echo "::error::Protected map-only CI contains changes outside ${deployment_lock}"
            exit 1
          fi
          if git diff --quiet "$default_ref...$GITHUB_SHA" -- \
            "$deployment_lock"; then
            echo "::error::Protected map-only CI does not change ${deployment_lock}"
            exit 1
          fi
      - id: components
        name: Select changed components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '0000000000000000000000000000000000000000' }}
          CI_SCOPE: ${{ github.ref_type == 'tag' && 'all' || inputs.scope || 'auto' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          FIRMWARE_HARDWARE: ${{ inputs.firmware_hardware || '175' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if test "$EVENT_NAME" = workflow_dispatch && test "$CI_SCOPE" = map; then
            case "$GITHUB_REF" in
              refs/heads/deploy/map-platform-production|refs/heads/deploy/map-platform-development)
                # The exact branch/file restriction above must pass first.
                EVENT_NAME=pull_request
                BASE_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
                CI_SCOPE=auto
                ;;
            esac
          fi
          python3 .github/scripts/changed_components.py \
            --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --scope "$CI_SCOPE" --firmware-hardware "$FIRMWARE_HARDWARE" >> "$GITHUB_OUTPUT"


  esp32:
    name: ESP32 (${{ matrix.target }})
    needs: changes
    if: >-
      needs.changes.outputs.firmware_build == 'true' &&
      needs.changes.outputs.heavy_ci == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.firmware_targets) }}
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore pinned PlatformIO downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: esp32/.pio/open-bike-build/downloads
          key: esp32-pinned-downloads-${{ runner.os }}-${{ hashFiles('esp32/tools/generated_sdkconfig.py') }}
      - id: cache
        name: Restore verified firmware build caches
        uses: ./.github/actions/firmware-build-cache
        with:
          environment: ${{ matrix.target }}
          github-token: ${{ github.token }}
      - name: Build with the repository-owned firmware runtime
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          factory_args=()
          # E-paper production is a compile/size qualification profile only;
          # factory and release packaging remain AMOLED-only.
          if [[ "${BUILD_ENVIRONMENT}" == WAVESHARE_AMOLED_*_PRODUCTION ]]; then
            factory_target="${BUILD_ENVIRONMENT%_PRODUCTION}"
            factory_args=(
              --factory-output-dir
              "${RUNNER_TEMP}/factory-${factory_target}"
            )
          fi
          env -u LD_LIBRARY_PATH python3 tools/build_firmware.py \
            "${BUILD_ENVIRONMENT}" "${factory_args[@]}"
      - name: Retain exact firmware symbols and report cache observations
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
          BICINO_BUILD_EVIDENCE_DIR: ${{ runner.temp }}/bicino-build-symbols
        run: python3 ../tools/build_evidence.py firmware --environment "$BUILD_ENVIRONMENT"
      - id: core_identity
        name: Record the verified core identity
        working-directory: ${{ github.workspace }}
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: python3 .github/scripts/firmware_core_artifact.py identity --project esp32 --environment "$BUILD_ENVIRONMENT" >> "$GITHUB_OUTPUT"
      - name: Pack the verified core entry for pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.core-artifact-fresh != 'true'
        working-directory: ${{ github.workspace }}
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
          CORE_INPUT_KEY: ${{ steps.core_identity.outputs.core-input-key }}
        run: |
          python3 .github/scripts/firmware_core_artifact.py pack \
            --root "${OPEN_BIKE_FIRMWARE_BUILD_CACHE}/cores-v1/${BUILD_ENVIRONMENT}" \
            --key "${CORE_INPUT_KEY}" --output "${RUNNER_TEMP}/firmware-core-entry.tar"
      - name: Publish the verified core entry for pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.core-artifact-fresh != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cache.outputs.core-artifact-name }}
          path: ${{ runner.temp }}/firmware-core-entry.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Stress eight rider badges with the pinned LVGL renderer
        if: contains(matrix.target, '_REMOTE_DEBUG') && needs.changes.outputs.firmware_renderer != 'false'
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          python3 tools/run_social_riders_render_test.py --lvgl-source \
            ".pio/open-bike-build/platformio/${BUILD_ENVIRONMENT}/libdeps/${BUILD_ENVIRONMENT}/lvgl"
      - name: Verify remote-debug excludes locale startup allocations
        if: contains(matrix.target, '_REMOTE_DEBUG')
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          python3 tools/check_debug_memory.py \
            --elf ".pio/build/${BUILD_ENVIRONMENT}/firmware.elf" \
            --nm ".pio/open-bike-build/platformio/${BUILD_ENVIRONMENT}/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp-elf-nm"
      - name: Upload firmware symbol and cache evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-build-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/bicino-build-symbols/
          if-no-files-found: error
      - name: Report largest firmware symbols after build failure
        if: failure()
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          elf=".pio/build/${BUILD_ENVIRONMENT}/firmware.elf"
          if [[ ! -f "${elf}" ]]; then
            echo "No linked firmware image is available for symbol analysis"
            exit 0
          fi
          nm_bin="$(find .pio/open-bike-build -type f \
            \( -name 'xtensa-esp-elf-nm' -o \
               -name 'xtensa-esp32s3-elf-nm' \) \
            -perm -111 -print -quit)"
          if [[ -z "${nm_bin}" ]]; then
            echo "No Xtensa nm executable is available for symbol analysis"
            exit 0
          fi
          "${nm_bin}" --print-size --size-sort --radix=d "${elf}" | tail -n 120
      - name: Verify production factory bundle packaging
        if: endsWith(matrix.target, '_PRODUCTION') && startsWith(matrix.target, 'WAVESHARE_AMOLED_')
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          factory_target="${BUILD_ENVIRONMENT%_PRODUCTION}"
          output_dir="${RUNNER_TEMP}/factory-${factory_target}"
          extract_dir="${RUNNER_TEMP}/factory-extract-${factory_target}"
          mkdir -p "${extract_dir}"
          tar -xzf "${output_dir}/${factory_target}.factory.tar.gz" \
            -C "${extract_dir}"
          cd "${extract_dir}/${factory_target}.factory"
          sha256sum --check SHA256SUMS
      - name: Verify ordinary artifacts exclude remote-debug routes
        if: ${{ !contains(matrix.target, '_REMOTE_DEBUG') }}
        run: |
          if grep -aFq "/device-debug/" ".pio/build/${{ matrix.target }}/firmware.elf"; then
            echo "Non-debug firmware contains remote-debug routes"
            exit 1
          fi
          if grep -aFq "map-dev-2026-08" ".pio/build/${{ matrix.target }}/firmware.elf"; then
            echo "Non-debug firmware contains the development map signer"
            exit 1
          fi
      - name: Verify World Radio preview artifact gate
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          # Use the stable diagnostics-only marker emitted by the preview
          # screen instead of a renderer-specific log message.
          has_radio=false
          if grep -aFq "World Radio preview artifact v1" ".pio/build/${BUILD_ENVIRONMENT}/firmware.bin"; then
            has_radio=true
          fi
          case "$BUILD_ENVIRONMENT" in
            *_PRODUCTION|*_LIFECYCLE_QUALIFICATION)
              test "$has_radio" = false
              ;;
            *)
              test "$has_radio" = true
              ;;
          esac
      - name: Verify ordinary artifacts include persistent diagnostics capability
        if: ${{ !contains(matrix.target, '_REMOTE_DEBUG') }}
        run: |
          python3 - "${{ matrix.target }}" <<'PY'
          from pathlib import Path
          import sys

          artifact = Path(".pio/build") / sys.argv[1] / "firmware.elf"
          firmware = artifact.read_bytes()
          required = (
              "/device-diagnostics/v1/",
              "storage_gap",
          )
          missing = [
              marker for marker in required
              if marker.encode("utf-8") + b"\0" not in firmware
          ]
          if missing:
              raise SystemExit(
                  "Missing persistent diagnostics markers: " + ", ".join(missing)
              )
          PY
      - name: Verify nonshipping lifecycle adapter coverage
        if: endsWith(matrix.target, '_LIFECYCLE_QUALIFICATION')
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          python3 - "${BUILD_ENVIRONMENT}" <<'PYTHON'
          from pathlib import Path
          import sys

          profile = sys.argv[1]
          firmware = (Path(".pio/build") / profile / "firmware.elf").read_bytes()
          # These messages exist only inside FIRMWARE_OPERATIONS_V1_ENABLED.
          # Keep the actual authenticated OTA adapter compiled, not only policies.
          required = (
              profile,
              "fresh durable admission and operation identity required",
              "durable OTA acceptance could not be confirmed",
          )
          missing = [marker for marker in required if marker.encode() + b"\0" not in firmware]
          if missing:
              raise SystemExit("Missing lifecycle qualification markers: " + ", ".join(missing))
          PYTHON
      - name: Verify remote-debug browser service
        if: contains(matrix.target, '_REMOTE_DEBUG')
        run: |
          grep -aFq "/device-debug/" ".pio/build/${{ matrix.target }}/firmware.elf"
          grep -aFq "Bicino real-device debugger" ".pio/build/${{ matrix.target }}/firmware.elf"
      - name: Verify remote-debug artifacts include renderer metrics routes
        if: contains(matrix.target, '_REMOTE_DEBUG')
        run: |
          python3 - "${{ matrix.target }}" <<'PY'
          from pathlib import Path
          import sys

          artifact = Path(".pio/build") / sys.argv[1] / "firmware.elf"
          firmware = artifact.read_bytes()
          routes = (
              "/device-debug/v1/metrics",
              "/device-debug/v1/metrics/window",
          )
          missing = [
              route for route in routes if route.encode("utf-8") + b"\0" not in firmware
          ]
          if missing:
              raise SystemExit(f"Missing remote-debug routes: {', '.join(missing)}")
          if b"map-dev-2026-08\0" not in firmware:
              raise SystemExit("Missing remote-debug development map signer")
          PY
      - id: release_bytes
        name: Retain verified production bytes for this release candidate
        if: github.ref_type == 'tag' && endsWith(matrix.target, '_PRODUCTION')
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          factory_target="${BUILD_ENVIRONMENT%_PRODUCTION}"
          echo "directory=${RUNNER_TEMP}/factory-${factory_target}" >> "$GITHUB_OUTPUT"
          cp ".pio/build/${BUILD_ENVIRONMENT}/firmware.bin" "${RUNNER_TEMP}/factory-${factory_target}/${factory_target}.bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag' && endsWith(matrix.target, '_PRODUCTION')
        with:
          name: verified-production-${{ matrix.target }}
          path: |
            ${{ steps.release_bytes.outputs.directory }}/*.bin
            ${{ steps.release_bytes.outputs.directory }}/*.factory-bundle.json
            ${{ steps.release_bytes.outputs.directory }}/*.factory.tar.gz
          if-no-files-found: error
          retention-days: 14

  ios-fast:
    name: iOS Fast Tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run selected Swift and host contracts
        env:
          IOS_CHECKS: ${{ needs.changes.outputs.ios_checks }}
          GH_TOKEN: ${{ github.token }}
          LOCAL_RESULTS_ALLOWED: ${{ github.event_name == 'pull_request' && !inputs.scope }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          checks = json.loads(os.environ['IOS_CHECKS'])
          if not isinstance(checks, list) or not checks:
              raise SystemExit('iOS scope must select at least one check')
          command = ['python3', 'tools/dev_check.py', '--reuse-local']
          for check in checks:
              command.extend(['--check', check])
          command.extend(['--report', os.environ['RUNNER_TEMP']+'/dev-checks/ios-fast/results.json'])
          subprocess.run(command, check=True)
          PYTHON
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-fast-evidence
          path: ${{ runner.temp }}/dev-checks/
          if-no-files-found: error

  ios-platform:
    name: iOS Simulator Tests
    needs: changes
    if: >-
      needs.changes.outputs.ios_simulator == 'true' &&
      needs.changes.outputs.heavy_ci == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure job-scoped Xcode DerivedData
        run: echo "CI_DERIVED_DATA_PATH=$RUNNER_TEMP/BikeComputerDerivedData" >> "$GITHUB_ENV"
      - name: Run iOS and Watch simulator contracts
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_RESULTS_ALLOWED: ${{ github.event_name == 'pull_request' && !inputs.scope }}
        run: python3 tools/dev_check.py --reuse-local --check ios-simulator --report "$RUNNER_TEMP/dev-checks/ios-simulator/results.json"
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-evidence
          path: ${{ runner.temp }}/dev-checks/
          if-no-files-found: error

  ios:
    name: iOS App Builds
    needs: changes
    if: >-
      needs.changes.outputs.ios_native == 'true' &&
      needs.changes.outputs.heavy_ci == 'true'
    runs-on: macos-latest
    env:
      BICINO_REQUIRE_BUILD_EVIDENCE: "1"
      BICINO_IOS_CONFIGURATIONS: ${{ needs.changes.outputs.ios_release == 'true' && 'Debug,Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure exact-build symbol retention
        run: echo "BICINO_BUILD_EVIDENCE_DIR=$RUNNER_TEMP/bicino-build-symbols" >> "$GITHUB_ENV"
      - name: Build and validate selected app containers
        run: python3 tools/dev_check.py --check ios-build-containers --fresh --evidence --report "$RUNNER_TEMP/dev-checks/ios-build-containers/results.json"
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-container-evidence
          path: |
            ${{ runner.temp }}/dev-checks/
            ${{ runner.temp }}/bicino-build-symbols/
          if-no-files-found: error

  esp32-host:
    name: ESP32 Host Tests
    needs: changes
    if: needs.changes.outputs.firmware_host == 'true'
    runs-on: ubuntu-latest
    env:
      FIRMWARE_HOST_CHECKS: ${{ needs.changes.outputs.firmware_host_checks }}
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate selected host checks
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          checks = json.loads(os.environ['FIRMWARE_HOST_CHECKS'])
          registry = json.load(open('tools/development/checks.json'))['checks']
          known = {c['id'] for c in registry if c['component'] == 'firmware_host'}
          if not isinstance(checks, list) or not checks or any(not isinstance(c, str) for c in checks):
              raise SystemExit('firmware host scope must be a nonempty list of check IDs')
          if len(checks) != len(set(checks)) or set(checks) - known:
              raise SystemExit('firmware host scope contains duplicate or unknown checks')
          PYTHON
      - name: Install native host test dependencies
        if: join(fromJSON(needs.changes.outputs.firmware_host_checks), ',') != 'esp32-host-firmware-manifest-tests'
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev python3-cryptography
      - name: Install Python host test dependencies
        run: python3 -m pip install -r ../tools/development/requirements.txt
      - name: Firmware manifest tests
        if: contains(fromJSON(needs.changes.outputs.firmware_host_checks), 'esp32-host-firmware-manifest-tests')
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-firmware-manifest-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-firmware-manifest-tests/results.json"
        working-directory: ${{ github.workspace }}
      - name: Shutdown barrier executable fault tests
        if: contains(fromJSON(needs.changes.outputs.firmware_host_checks), 'esp32-host-shutdown-barrier-executable-fault-tests')
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-shutdown-barrier-executable-fault-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-shutdown-barrier-executable-fault-tests/results.json"
      - name: Runtime ownership and allocation recovery tests
        if: contains(fromJSON(needs.changes.outputs.firmware_host_checks), 'esp32-host-runtime-ownership-and-allocation-recovery-tests')
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-runtime-ownership-and-allocation-recovery-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-runtime-ownership-and-allocation-recovery-tests/results.json"
      - name: Ride diagnostics and watchdog host tests
        if: contains(fromJSON(needs.changes.outputs.firmware_host_checks), 'esp32-host-ride-diagnostics-and-watchdog-host-tests')
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-ride-diagnostics-and-watchdog-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-ride-diagnostics-and-watchdog-host-tests/results.json"
      - name: Verify generated pre-connection assets
        if: contains(fromJSON(needs.changes.outputs.firmware_host_checks), 'esp32-host-verify-generated-pre-connection-assets')
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-verify-generated-pre-connection-assets --report "$RUNNER_TEMP/dev-checks/esp32-host-verify-generated-pre-connection-assets/results.json"
      - name: GUI layout host tests
        if: contains(fromJSON(needs.changes.outputs.firmware_host_checks), 'esp32-host-gui-layout-host-tests')
