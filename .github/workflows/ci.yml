name: CI

on:
  workflow_call:
    inputs:
      scope:
        description: CI component to run
        required: false
        default: all
        type: string
      firmware_hardware:
        description: Firmware hardware families to build
        required: false
        default: "175"
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      scope:
        description: CI component to run
        required: true
        default: all
        type: choice
        options:
          - all
          - firmware
          - ios
          - map
      firmware_hardware:
        description: Firmware hardware families to build
        required: true
        default: "175"
        type: choice
        options:
          - "175"
          - "206"
          - all

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}-${{ inputs.scope || 'auto' }}-${{
    inputs.firmware_hardware || '175' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI components
    runs-on: ubuntu-latest
    outputs:
      firmware_build: ${{ steps.components.outputs.firmware_build }}
      firmware_host: ${{ steps.components.outputs.firmware_host }}
      firmware_cache_qualification: ${{ steps.components.outputs.firmware_cache_qualification }}
      firmware_targets: ${{ steps.components.outputs.firmware_targets }}
      heavy_ci: ${{ steps.policy.outputs.heavy_ci }}
      ios: ${{ steps.components.outputs.ios }}
      map_backend: ${{ steps.components.outputs.map_backend }}
      osm: ${{ steps.components.outputs.osm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -shellcheck=
      - name: Test CI component routing
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Validate development check registry and isolation
        run: python3 tools/dev_check.py --check development-tools --report "$RUNNER_TEMP/dev-checks/development-tools/results.json"
      - name: Verify generated ride BLE contract
        run: python3 tools/generate_ride_ble_contract.py --check
      - id: policy
        name: Select CI cost policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          heavy_ci=true
          if test "$EVENT_NAME" = pull_request && test "$PULL_REQUEST_DRAFT" = true; then
            heavy_ci=false
          fi
          echo "heavy_ci=${heavy_ci}" >> "$GITHUB_OUTPUT"
      - name: Validate the protected partial gate scope
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.scope == 'map' &&
          (github.ref == 'refs/heads/deploy/map-platform-production' ||
          github.ref == 'refs/heads/deploy/map-platform-development')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/deploy/map-platform-production)
              deployment_lock=map-platform/deploy/compose.yaml
              ;;
            refs/heads/deploy/map-platform-development)
              deployment_lock=map-platform/deploy/compose.development.yaml
              ;;
            *)
              echo "::error::Unsupported protected promotion branch"
              exit 1
              ;;
          esac
          default_ref="origin/${DEFAULT_BRANCH}"
          if ! git diff --quiet "$default_ref...$GITHUB_SHA" -- \
            . ":(exclude)${deployment_lock}"; then
            echo "::error::Protected map-only CI contains changes outside ${deployment_lock}"
            exit 1
          fi
          if git diff --quiet "$default_ref...$GITHUB_SHA" -- \
            "$deployment_lock"; then
            echo "::error::Protected map-only CI does not change ${deployment_lock}"
            exit 1
          fi
      - id: components
        name: Select changed components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '0000000000000000000000000000000000000000' }}
          CI_SCOPE: ${{ github.ref_type == 'tag' && 'all' || inputs.scope || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          FIRMWARE_HARDWARE: ${{ inputs.firmware_hardware || '175' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: >-
          python3 .github/scripts/changed_components.py
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --scope "$CI_SCOPE"
          --firmware-hardware "$FIRMWARE_HARDWARE"
          >> "$GITHUB_OUTPUT"

  firmware-cache:
    name: Firmware cache qualification
    needs: changes
    if: needs.changes.outputs.firmware_cache_qualification == 'true'
    uses: ./.github/workflows/firmware-cache-qualification.yml

  esp32:
    name: ESP32 (${{ matrix.target }})
    needs: changes
    if: >-
      needs.changes.outputs.firmware_build == 'true' &&
      needs.changes.outputs.heavy_ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.firmware_targets) }}
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore pinned PlatformIO downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: esp32/.pio/open-bike-build/downloads
          key: esp32-pinned-downloads-${{ runner.os }}-${{ hashFiles('esp32/tools/generated_sdkconfig.py') }}
      - name: Restore verified firmware build caches
        uses: ./.github/actions/firmware-build-cache
        with:
          environment: ${{ matrix.target }}
      - name: Build with the repository-owned firmware runtime
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          factory_args=()
          if [[ "${BUILD_ENVIRONMENT}" == *_PRODUCTION ]]; then
            factory_target="${BUILD_ENVIRONMENT%_PRODUCTION}"
            factory_args=(
              --factory-output-dir
              "${RUNNER_TEMP}/factory-${factory_target}"
            )
          fi
          env -u LD_LIBRARY_PATH python3 tools/build_firmware.py \
            "${BUILD_ENVIRONMENT}" "${factory_args[@]}"
      - name: Report largest firmware symbols after build failure
        if: failure()
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          elf=".pio/build/${BUILD_ENVIRONMENT}/firmware.elf"
          if [[ ! -f "${elf}" ]]; then
            echo "No linked firmware image is available for symbol analysis"
            exit 0
          fi
          nm_bin="$(find .pio/open-bike-build -type f \
            \( -name 'xtensa-esp-elf-nm' -o \
               -name 'xtensa-esp32s3-elf-nm' \) \
            -perm -111 -print -quit)"
          if [[ -z "${nm_bin}" ]]; then
            echo "No Xtensa nm executable is available for symbol analysis"
            exit 0
          fi
          "${nm_bin}" --print-size --size-sort --radix=d "${elf}" | tail -n 120
      - name: Verify production factory bundle packaging
        if: endsWith(matrix.target, '_PRODUCTION')
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          factory_target="${BUILD_ENVIRONMENT%_PRODUCTION}"
          output_dir="${RUNNER_TEMP}/factory-${factory_target}"
          extract_dir="${RUNNER_TEMP}/factory-extract-${factory_target}"
          mkdir -p "${extract_dir}"
          tar -xzf "${output_dir}/${factory_target}.factory.tar.gz" \
            -C "${extract_dir}"
          cd "${extract_dir}/${factory_target}.factory"
          sha256sum --check SHA256SUMS
      - name: Verify ordinary artifacts exclude remote-debug routes
        if: ${{ !contains(matrix.target, '_REMOTE_DEBUG') }}
        run: |
          if grep -aFq "/device-debug/" ".pio/build/${{ matrix.target }}/firmware.elf"; then
            echo "Non-debug firmware contains remote-debug routes"
            exit 1
          fi
          if grep -aFq "map-dev-2026-08" ".pio/build/${{ matrix.target }}/firmware.elf"; then
            echo "Non-debug firmware contains the development map signer"
            exit 1
          fi
      - name: Verify World Radio preview artifact gate
        env:
          BUILD_ENVIRONMENT: ${{ matrix.target }}
        run: |
          # Use the stable diagnostics-only marker emitted by the preview
          # screen instead of a renderer-specific log message.
          has_radio=false
          if grep -aFq "World Radio preview artifact v1" ".pio/build/${BUILD_ENVIRONMENT}/firmware.bin"; then
            has_radio=true
          fi
          case "$BUILD_ENVIRONMENT" in
            *_PRODUCTION)
              test "$has_radio" = false
              ;;
            *)
              test "$has_radio" = true
              ;;
          esac
      - name: Verify ordinary artifacts include persistent diagnostics capability
        if: ${{ !contains(matrix.target, '_REMOTE_DEBUG') }}
        run: |
          python3 - "${{ matrix.target }}" <<'PY'
          from pathlib import Path
          import sys

          artifact = Path(".pio/build") / sys.argv[1] / "firmware.elf"
          firmware = artifact.read_bytes()
          required = (
              "/device-diagnostics/v1/",
              "storage_gap",
          )
          missing = [
              marker for marker in required
              if marker.encode("utf-8") + b"\0" not in firmware
          ]
          if missing:
              raise SystemExit(
                  "Missing persistent diagnostics markers: " + ", ".join(missing)
              )
          PY
      - name: Verify remote-debug artifacts include renderer metrics routes
        if: contains(matrix.target, '_REMOTE_DEBUG')
        run: |
          python3 - "${{ matrix.target }}" <<'PY'
          from pathlib import Path
          import sys

          artifact = Path(".pio/build") / sys.argv[1] / "firmware.elf"
          firmware = artifact.read_bytes()
          routes = (
              "/device-debug/v1/metrics",
              "/device-debug/v1/metrics/window",
          )
          missing = [
              route for route in routes if route.encode("utf-8") + b"\0" not in firmware
          ]
          if missing:
              raise SystemExit(f"Missing remote-debug routes: {', '.join(missing)}")
          if b"map-dev-2026-08\0" not in firmware:
              raise SystemExit("Missing remote-debug development map signer")
          PY

  ios-fast:
    name: iOS Fast Tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test generated app build identity
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-test-generated-app-build-identity --report "$RUNNER_TEMP/dev-checks/ios-fast-test-generated-app-build-identity/results.json"
        working-directory: ios-app
      - name: Run Swift helper tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-run-swift-helper-tests --report "$RUNNER_TEMP/dev-checks/ios-fast-run-swift-helper-tests/results.json"
        working-directory: ios-app
      - name: Run ride diagnostics recorder tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-run-ride-diagnostics-recorder-tests --report "$RUNNER_TEMP/dev-checks/ios-fast-run-ride-diagnostics-recorder-tests/results.json"
        working-directory: ios-app
      - name: Run shared route and Watch BLE contract tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-run-shared-route-and-watch-ble-contract-tests --report "$RUNNER_TEMP/dev-checks/ios-fast-run-shared-route-and-watch-ble-contract-tests/results.json"
        working-directory: ios-app
      - name: Type-check the complete Watch source graph
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-type-check-the-complete-watch-source-graph --report "$RUNNER_TEMP/dev-checks/ios-fast-type-check-the-complete-watch-source-graph/results.json"
        working-directory: ios-app
      - name: Run Watch offline navigation persistence tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-run-watch-offline-navigation-persistence-tests --report "$RUNNER_TEMP/dev-checks/ios-fast-run-watch-offline-navigation-persistence-tests/results.json"
        working-directory: ios-app
      - name: Run Watch online navigation policy tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-run-watch-online-navigation-policy-tests --report "$RUNNER_TEMP/dev-checks/ios-fast-run-watch-online-navigation-policy-tests/results.json"
        working-directory: ios-app
      - name: Fetch immutable pre-388 workout decoder
        run: git fetch --no-tags --depth=1 origin fe73e43431ed76c39159de7624c4cd9ede509434
      - name: Run workout contracts and firmware-to-Swift legacy compatibility tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check ios-fast-run-workout-contracts-and-firmware-to-swift-legacy-compatibility-tests --report "$RUNNER_TEMP/dev-checks/ios-fast-run-workout-contracts-and-firmware-to-swift-legacy-compatibility-tests/results.json"
        working-directory: ios-app
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-fast-evidence
          path: ${{ runner.temp }}/dev-checks/
          if-no-files-found: error

  ios-platform:
    name: iOS Simulator Tests
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' &&
      needs.changes.outputs.heavy_ci == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure job-scoped Xcode DerivedData
        run: echo "CI_DERIVED_DATA_PATH=$RUNNER_TEMP/BikeComputerDerivedData" >> "$GITHUB_ENV"
      - name: Run iOS and Watch simulator contracts
        run: python3 tools/dev_check.py --check ios-simulator --report "$RUNNER_TEMP/dev-checks/ios-simulator/results.json"
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-evidence
          path: ${{ runner.temp }}/dev-checks/
          if-no-files-found: error

  ios:
    name: iOS App Builds
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' &&
      needs.changes.outputs.heavy_ci == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and validate Debug and Release app containers
        run: python3 tools/dev_check.py --check ios-build-containers --report "$RUNNER_TEMP/dev-checks/ios-build-containers/results.json"
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-container-evidence
          path: |
            ${{ runner.temp }}/dev-checks/
            ${{ runner.temp }}/bicino-build-symbols/
          if-no-files-found: error

  esp32-host:
    name: ESP32 Host Tests
    needs: changes
    if: needs.changes.outputs.firmware_host == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install host crypto dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev python3-cryptography
          python3 -m pip install -r tools/preconnection-assets-requirements.txt
      - name: Firmware manifest tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-firmware-manifest-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-firmware-manifest-tests/results.json"
        working-directory: ${{ github.workspace }}
      - name: Runtime ownership and allocation recovery tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-runtime-ownership-and-allocation-recovery-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-runtime-ownership-and-allocation-recovery-tests/results.json"
      - name: Ride diagnostics and watchdog host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-ride-diagnostics-and-watchdog-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-ride-diagnostics-and-watchdog-host-tests/results.json"
      - name: Verify generated pre-connection assets
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-verify-generated-pre-connection-assets --report "$RUNNER_TEMP/dev-checks/esp32-host-verify-generated-pre-connection-assets/results.json"
      - name: GUI layout host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-gui-layout-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-gui-layout-host-tests/results.json"
      - name: Power metrics host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-power-metrics-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-power-metrics-host-tests/results.json"
      - name: Display power and redraw policy host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-display-power-and-redraw-policy-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-display-power-and-redraw-policy-host-tests/results.json"
      - name: Two-finger Map zoom host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-two-finger-map-zoom-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-two-finger-map-zoom-host-tests/results.json"
      - name: Map projection host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-map-projection-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-map-projection-host-tests/results.json"
      - name: Render-ahead map architecture host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-render-ahead-map-architecture-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-render-ahead-map-architecture-host-tests/results.json"
      - name: Map profile protocol host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-map-profile-protocol-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-map-profile-protocol-host-tests/results.json"
      - name: Device capabilities protocol host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-device-capabilities-protocol-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-device-capabilities-protocol-host-tests/results.json"
      - name: Screen configuration protocol and Ride Stats widget host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-screen-configuration-protocol-and-ride-stats-widget-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-screen-configuration-protocol-and-ride-stats-widget-host-tests/results.json"
      - name: Ride controller lease host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-ride-controller-lease-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-ride-controller-lease-host-tests/results.json"
      - name: Remote device debug host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-remote-device-debug-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-remote-device-debug-host-tests/results.json"
      - name: Filled line rasterizer host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-filled-line-rasterizer-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-filled-line-rasterizer-host-tests/results.json"
      - name: Device screen protocol host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-device-screen-protocol-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-device-screen-protocol-host-tests/results.json"
      - name: World Radio protocol and screen registry host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-world-radio-protocol-and-screen-registry-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-world-radio-protocol-and-screen-registry-host-tests/results.json"
      - name: Device ownership crypto host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-device-ownership-crypto-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-device-ownership-crypto-host-tests/results.json"
      - name: Device ownership state host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-device-ownership-state-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-device-ownership-state-host-tests/results.json"
      - name: Destination picker protocol host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-destination-picker-protocol-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-destination-picker-protocol-host-tests/results.json"
      - name: Workout telemetry protocol host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-workout-telemetry-protocol-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-workout-telemetry-protocol-host-tests/results.json"
      - name: Workout telemetry state and presentation host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-workout-telemetry-state-and-presentation-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-workout-telemetry-state-and-presentation-host-tests/results.json"
      - name: Ride automation policy and trace replay host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-ride-automation-policy-and-trace-replay-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-ride-automation-policy-and-trace-replay-host-tests/results.json"
      - name: Map profile persistence host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-map-profile-persistence-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-map-profile-persistence-host-tests/results.json"
      - name: Binary map block format host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-binary-map-block-format-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-binary-map-block-format-host-tests/results.json"
      - name: Map transfer host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-map-transfer-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-map-transfer-host-tests/results.json"
      - name: Map stream format host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-map-stream-format-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-map-stream-format-host-tests/results.json"
      - name: Transfer control dispatch host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-transfer-control-dispatch-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-transfer-control-dispatch-host-tests/results.json"
      - name: Device transfer HTTP limit host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-device-transfer-http-limit-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-device-transfer-http-limit-host-tests/results.json"
      - name: Sound protocol host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-sound-protocol-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-sound-protocol-host-tests/results.json"
      - name: Codec recovery host tests
        run: python3 "${{ github.workspace }}/tools/dev_check.py" --check esp32-host-codec-recovery-host-tests --report "$RUNNER_TEMP/dev-checks/esp32-host-codec-recovery-host-tests/results.json"
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-host-evidence
          path: ${{ runner.temp }}/dev-checks/
          if-no-files-found: error

  map-platform:
    name: Map Platform
    needs: changes
    if: >-
      needs.changes.outputs.map_backend == 'true' ||
      needs.changes.outputs.osm == 'true'
    permissions:
      attestations: read
      contents: read
      packages: read
    uses: ./.github/workflows/map-platform-ci.yml
    with:
      run_backend: ${{ needs.changes.outputs.map_backend == 'true' }}
      run_osm: ${{ needs.changes.outputs.osm == 'true' }}

  gate:
    name: >-
      ${{ (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' ||
      (inputs.scope == 'map' &&
      (github.ref == 'refs/heads/deploy/map-platform-production' ||
      github.ref == 'refs/heads/deploy/map-platform-development'))) && 'CI Gate' ||
      format('Manual CI Gate ({0})', inputs.scope) }}
    needs:
      - changes
      - esp32
      - esp32-host
      - firmware-cache
      - ios-fast
      - ios
      - ios-platform
      - map-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected component
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ESP32_RESULT: ${{ needs.esp32.result }}
          FIRMWARE_BUILD_CHANGED: ${{ needs.changes.outputs.firmware_build }}
          FIRMWARE_HOST_CHANGED: ${{ needs.changes.outputs.firmware_host }}
          FIRMWARE_CACHE_QUALIFICATION: ${{ needs.changes.outputs.firmware_cache_qualification }}
          CACHE_RESULT: ${{ needs.firmware-cache.result }}
          HOST_RESULT: ${{ needs.esp32-host.result }}
          HEAVY_CI: ${{ needs.changes.outputs.heavy_ci }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
          IOS_FAST_RESULT: ${{ needs.ios-fast.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          IOS_PLATFORM_RESULT: ${{ needs.ios-platform.result }}
          MAP_BACKEND_CHANGED: ${{ needs.changes.outputs.map_backend }}
          MAP_RESULT: ${{ needs.map-platform.result }}
          OSM_CHANGED: ${{ needs.changes.outputs.osm }}
        run: |
          require_result() {
            label="$1"
            actual="$2"
            expected="$3"
            if test "$actual" != "$expected"; then
              echo "::error::${label} result was ${actual}; expected ${expected}"
              exit 1
            fi
          }

          require_result "CI component selection" "$CHANGES_RESULT" success

          if test "$FIRMWARE_CACHE_QUALIFICATION" = true; then
            require_result "Firmware cache qualification" "$CACHE_RESULT" success
          else
            require_result "Firmware cache qualification" "$CACHE_RESULT" skipped
          fi

          if test "$FIRMWARE_BUILD_CHANGED" = true && test "$HEAVY_CI" = true; then
            require_result "ESP32 builds" "$ESP32_RESULT" success
          else
            require_result "ESP32 builds" "$ESP32_RESULT" skipped
          fi

          if test "$FIRMWARE_HOST_CHANGED" = true; then
            require_result "ESP32 host tests" "$HOST_RESULT" success
          else
            require_result "ESP32 host tests" "$HOST_RESULT" skipped
          fi

          if test "$IOS_CHANGED" = true; then
            require_result "iOS fast tests" "$IOS_FAST_RESULT" success
          else
            require_result "iOS fast tests" "$IOS_FAST_RESULT" skipped
          fi

          if test "$IOS_CHANGED" = true && test "$HEAVY_CI" = true; then
            require_result "iOS app builds" "$IOS_RESULT" success
            require_result "iOS simulator tests" "$IOS_PLATFORM_RESULT" success
          else
            require_result "iOS app builds" "$IOS_RESULT" skipped
            require_result "iOS simulator tests" "$IOS_PLATFORM_RESULT" skipped
          fi

          if test "$MAP_BACKEND_CHANGED" = true || test "$OSM_CHANGED" = true; then
            require_result "Map Platform" "$MAP_RESULT" success
          else
            require_result "Map Platform" "$MAP_RESULT" skipped
          fi
