name: CI

on:
  workflow_call:
    inputs:
      scope:
        description: CI component to run
        required: false
        default: all
        type: string
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/firmware-diagnostics.yml"
      - ".github/workflows/firmware-release.yml"
      - ".github/workflows/map-platform-ci.yml"
      - ".github/workflows/map-platform-image.yml"
      - ".github/workflows/speaker-firmware.yml"
      - "docs/app-store-privacy-disclosures.md"
      - "docs/device-ownership-test-vectors.json"
      - "docs/firmware-battery-life-hardware-validation.md"
      - "docs/firmware-map-memory-diagnostics.md"
      - "docs/firmware-map-render-scheduler.md"
      - "docs/firmware-map-rendering-psram.md"
      - "docs/releases/watchos-workout-companion.md"
      - "esp32/**"
      - "ios-app/**"
      - "map-platform/**"
      - "test-fixtures/fmb/**"
      - "tools/firmware_manifest.py"
      - "tools/tests/**"
      - "tools/OSM_Extract/**"
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: CI component to run
        required: true
        default: all
        type: choice
        options:
          - all
          - firmware
          - ios
          - map

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}-${{ inputs.scope || 'auto' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI components
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.components.outputs.firmware }}
      ios: ${{ steps.components.outputs.ios }}
      map_backend: ${{ steps.components.outputs.map_backend }}
      osm: ${{ steps.components.outputs.osm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test CI component routing
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Validate the protected partial gate scope
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.scope == 'map' &&
          github.ref == 'refs/heads/deploy/map-platform-production'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          default_ref="origin/${DEFAULT_BRANCH}"
          if ! git diff --quiet "$default_ref...$GITHUB_SHA" -- \
            . ':(exclude)map-platform/deploy/compose.yaml'; then
            echo "::error::Protected map-only CI contains changes outside the production lock"
            exit 1
          fi
          if git diff --quiet "$default_ref...$GITHUB_SHA" -- \
            map-platform/deploy/compose.yaml; then
            echo "::error::Protected map-only CI does not change the production lock"
            exit 1
          fi
      - id: components
        name: Select changed components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          CI_SCOPE: ${{ github.ref_type == 'tag' && 'all' || inputs.scope || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/changed_components.py
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --scope "$CI_SCOPE"
          >> "$GITHUB_OUTPUT"

  esp32:
    name: ESP32 (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - WAVESHARE_AMOLED_175
          - WAVESHARE_AMOLED_175_PRODUCTION
          - WAVESHARE_AMOLED_206
          - WAVESHARE_AMOLED_206_PRODUCTION
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore pinned PlatformIO downloads
        uses: actions/cache@v6
        with:
          path: esp32/.pio/open-bike-build/downloads
          key: esp32-pinned-downloads-${{ runner.os }}-${{ hashFiles('esp32/tools/generated_sdkconfig.py') }}
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: env -u LD_LIBRARY_PATH python tools/build_firmware.py "${{ matrix.target }}"

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test generated app build identity
        run: python3 -m unittest discover -s scripts/tests
        working-directory: ios-app
      - name: Run Swift helper tests
        run: ./scripts/run-navigation-tests.sh
        working-directory: ios-app
      - name: Run shared route and Watch BLE contract tests
        run: ./scripts/run-ride-shared-tests.sh
        working-directory: ios-app
      - name: Run Watch offline navigation persistence tests
        run: ./scripts/run-watch-offline-navigation-tests.sh
        working-directory: ios-app
      - name: Run Watch online navigation policy tests
        run: ./scripts/run-watch-online-navigation-tests.sh
        working-directory: ios-app
      - name: Run workout contract tests
        run: ./scripts/run-workout-contract-tests.sh
        working-directory: ios-app
      - name: Run workout contract tests on iOS
        run: ./scripts/run-workout-platform-tests.sh ios
        working-directory: ios-app
      - name: Run workout contract tests on watchOS
        run: ./scripts/run-workout-platform-tests.sh watchos
        working-directory: ios-app
      - name: Build watch app
        run: |
          xcodebuild \
            -project BikeComputer/BikeComputer.xcodeproj \
            -target BikeComputerWatch \
            -configuration Release \
            -sdk watchos \
            -arch arm64_32 \
            ONLY_ACTIVE_ARCH=YES \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/bike-computer-watch" \
            OBJROOT="$RUNNER_TEMP/bike-computer-watch-obj" \
            SYMROOT="$RUNNER_TEMP/bike-computer-watch-sym" \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios-app
      - name: Build Release app container
        run: |
          xcodebuild \
            -project BikeComputer/BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/bike-computer-release" \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios-app
      - name: Validate Release app container
        run: >-
          bash ./scripts/verify-release-container.sh
          "$RUNNER_TEMP/bike-computer-release/Build/Products/Release-iphoneos/BikeComputer.app"
        working-directory: ios-app

  esp32-host:
    name: ESP32 Host Tests
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@v7
      - name: Install host crypto dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev python3-cryptography
      - name: Firmware manifest tests
        run: python3 -m unittest discover -s tools/tests
        working-directory: ${{ github.workspace }}
      - name: GUI layout host tests
        run: |
          PYTHONPATH=tools python -m unittest \
            tools.tests.test_build_firmware \
            tools.tests.test_firmware_build_identity \
            tools.tests.test_generated_sdkconfig \
            tools.tests.test_capture_boot \
            tools.tests.test_resolve_upload_port \
            tools.tests.test_map_guidance_integration \
            tools.tests.test_map_memory_diagnostics
          g++ -std=c++17 \
            tools/tests/test_gui_layout.cpp \
            -o /tmp/test_gui_layout_175
          /tmp/test_gui_layout_175
          g++ -std=c++17 \
            -DWAVESHARE_AMOLED_206 \
            tools/tests/test_gui_layout.cpp \
            -o /tmp/test_gui_layout_206
          /tmp/test_gui_layout_206
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_building_renderer.cpp \
            -o /tmp/test_map_building_renderer
          /tmp/test_map_building_renderer
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_main_screen_entry_policy.cpp \
            -o /tmp/test_main_screen_entry_policy
          /tmp/test_main_screen_entry_policy
      - name: Power metrics host tests
        run: |
          PYTHONPATH=tools python -m unittest \
            tools.tests.test_power_trace_summary
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_power_metrics_schema.cpp \
            -o /tmp/test_power_metrics_schema
          /tmp/test_power_metrics_schema
      - name: Display power and redraw policy host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_display_power_policy.cpp \
            -o /tmp/test_display_power_policy
          /tmp/test_display_power_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_display_inactivity_policy.cpp \
            -o /tmp/test_display_inactivity_policy
          /tmp/test_display_inactivity_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_ui_scheduler_policy.cpp \
            -o /tmp/test_ui_scheduler_policy
          /tmp/test_ui_scheduler_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_power_management_policy.cpp \
            -o /tmp/test_power_management_policy
          /tmp/test_power_management_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_axp2101_register_policy.cpp \
            -o /tmp/test_axp2101_register_policy
          /tmp/test_axp2101_register_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_boot_diagnostics_policy.cpp \
            -o /tmp/test_boot_diagnostics_policy
          /tmp/test_boot_diagnostics_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_speaker_playback_policy.cpp \
            -o /tmp/test_speaker_playback_policy
          /tmp/test_speaker_playback_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_sd_mount_policy.cpp \
            -o /tmp/test_sd_mount_policy
          /tmp/test_sd_mount_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DAUTOMATIC_LIGHT_SLEEP_EXPERIMENT=1 \
            tools/tests/test_power_management_policy.cpp \
            -o /tmp/test_power_management_policy_light_sleep
          /tmp/test_power_management_policy_light_sleep
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_active_low_wake_interrupt_gate.cpp \
            -o /tmp/test_active_low_wake_interrupt_gate
          /tmp/test_active_low_wake_interrupt_gate
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_ble_radio_policy.cpp \
            -o /tmp/test_ble_radio_policy
          /tmp/test_ble_radio_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DBLE_RADIO_CHARACTERIZATION=1 -DBLE_TX_POWER_DBM=3 \
            tools/tests/test_ble_radio_policy.cpp \
            -o /tmp/test_ble_radio_policy_p3
          /tmp/test_ble_radio_policy_p3
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DBLE_RADIO_CHARACTERIZATION=1 -DBLE_TX_POWER_DBM=0 \
            tools/tests/test_ble_radio_policy.cpp \
            -o /tmp/test_ble_radio_policy_p0
          /tmp/test_ble_radio_policy_p0
          if g++ -std=c++17 -Wall -Wextra -Werror \
            -DBLE_TX_POWER_DBM=3 \
            tools/tests/test_ble_radio_policy.cpp \
            -o /tmp/test_ble_radio_policy_unsafe; then
            echo "Non-default TX power compiled without characterization"
            exit 1
          fi
          PYTHONPATH=tools python -m unittest \
            tools.tests.test_pioarduino_custom_core
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_ui_update_policy.cpp \
            -o /tmp/test_ui_update_policy
          /tmp/test_ui_update_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_render_policy.cpp \
            -o /tmp/test_map_render_policy
          /tmp/test_map_render_policy
          python tools/tests/test_firmware_profile_config.py
      - name: Two-finger Map zoom host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_cst9217_touch_frame.cpp \
            -o /tmp/test_cst9217_touch_frame
          /tmp/test_cst9217_touch_frame
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_pinch_zoom.cpp \
            -o /tmp/test_map_pinch_zoom
          /tmp/test_map_pinch_zoom
      - name: Map projection host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_projection.cpp \
            -o /tmp/test_map_projection
          /tmp/test_map_projection
      - name: Render-ahead map architecture host tests
        run: |
          for test in \
            test_map_render_job \
            test_map_presentation \
            test_map_pose_input_policy \
            test_gps_input_freshness \
            test_map_building_admission \
            test_map_route_geometry \
            test_map_building_workspace; do
            g++ -std=c++17 -Wall -Wextra -Werror \
              "tools/tests/${test}.cpp" \
              -o "/tmp/${test}"
            "/tmp/${test}"
          done
      - name: Map profile protocol host tests
        run: |
          g++ -std=c++17 \
            tools/tests/test_map_profile_protocol.cpp \
            -o /tmp/test_map_profile_protocol
          /tmp/test_map_profile_protocol
      - name: Device capabilities protocol host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_device_capabilities_protocol.cpp \
            -o /tmp/test_device_capabilities_protocol
          /tmp/test_device_capabilities_protocol
      - name: Ride controller lease host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_ride_controller_lease.cpp \
            -o /tmp/test_ride_controller_lease
          /tmp/test_ride_controller_lease
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_scoped_watch_payload_policy.cpp \
            -o /tmp/test_scoped_watch_payload_policy
          /tmp/test_scoped_watch_payload_policy
      - name: Filled line rasterizer host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_line_rasterizer.cpp \
            -o /tmp/test_line_rasterizer
          /tmp/test_line_rasterizer
      - name: Device screen protocol host tests
        run: |
          g++ -std=c++17 \
            tools/tests/test_device_screen_protocol.cpp \
            -o /tmp/test_device_screen_protocol
          /tmp/test_device_screen_protocol
      - name: Device ownership crypto host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DDEVICE_OWNERSHIP_HOST_TEST \
            lib/ble_navigation/device_ownership_crypto.cpp \
            tools/tests/test_device_ownership_crypto.cpp \
            $(pkg-config --cflags --libs mbedcrypto) \
            -o /tmp/test_device_ownership_crypto
          /tmp/test_device_ownership_crypto
      - name: Device ownership state host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DDEVICE_OWNERSHIP_HOST_TEST \
            -Itools/tests/host_stubs \
            lib/ble_navigation/device_ownership.cpp \
            lib/ble_navigation/device_ownership_crypto.cpp \
            tools/tests/test_device_ownership.cpp \
            $(pkg-config --cflags --libs mbedcrypto) \
            -o /tmp/test_device_ownership
          /tmp/test_device_ownership
      - name: Destination picker protocol host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_destination_picker_protocol.cpp \
            -o /tmp/test_destination_picker_protocol
          /tmp/test_destination_picker_protocol
      - name: Workout telemetry protocol host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_workout_telemetry_protocol.cpp \
            -o /tmp/test_workout_telemetry_protocol
          /tmp/test_workout_telemetry_protocol
      - name: Workout telemetry state and presentation host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_workout_telemetry_state.cpp \
            -o /tmp/test_workout_telemetry_state
          /tmp/test_workout_telemetry_state
      - name: Ride automation policy and trace replay host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_ride_automation_policy.cpp \
            -o /tmp/test_ride_automation_policy
          /tmp/test_ride_automation_policy
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_ride_automation_protocol.cpp \
            -o /tmp/test_ride_automation_protocol
          /tmp/test_ride_automation_protocol
          PYTHONPATH=tools python3 -m unittest \
            tools.tests.test_ride_trace_replay
      - name: Map profile persistence host tests
        run: |
          g++ -std=c++17 \
            tools/tests/test_map_profile_persistence.cpp \
            -o /tmp/test_map_profile_persistence
          /tmp/test_map_profile_persistence
      - name: Binary map block format host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            lib/maps/src/mapBlockFormat.cpp \
            lib/maps/src/mapBuildingBlock.cpp \
            tools/tests/test_map_block_format.cpp \
            -o /tmp/test_map_block_format
          /tmp/test_map_block_format
          g++ -std=c++17 -Wall -Wextra -Werror \
            lib/maps/src/mapFontAssetFormat.cpp \
            tools/tests/test_map_font_asset_format.cpp \
            -o /tmp/test_map_font_asset_format
          /tmp/test_map_font_asset_format
          g++ -std=c++17 -Wall -Wextra -Werror \
            lib/maps/src/mapBlockFormat.cpp \
            lib/maps/src/mapLabelBlock.cpp \
            tools/tests/test_map_label_block.cpp \
            -o /tmp/test_map_label_block
          /tmp/test_map_label_block
          g++ -std=c++17 -Wall -Wextra -Werror -Wframe-larger-than=4096 \
            lib/maps/src/mapFontAssetFormat.cpp \
            lib/maps/src/mapFontAsset.cpp \
            tools/tests/test_map_font_asset.cpp \
            -o /tmp/test_map_font_asset
          /tmp/test_map_font_asset
          g++ -std=c++17 -Wall -Wextra -Werror \
            lib/maps/src/mapLabelLayout.cpp \
            tools/tests/test_map_label_layout.cpp \
            -o /tmp/test_map_label_layout
          /tmp/test_map_label_layout
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_label_rasterizer.cpp \
            -o /tmp/test_map_label_rasterizer
          /tmp/test_map_label_rasterizer
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_label_selection.cpp \
            -o /tmp/test_map_label_selection
          /tmp/test_map_label_selection
      - name: Map transfer host tests
        run: |
          g++ -std=c++17 \
            lib/map_transfer/map_transfer.cpp \
            lib/maps/src/mapBlockFormat.cpp \
            lib/maps/src/mapLabelBlock.cpp \
            lib/maps/src/mapFontAsset.cpp \
            lib/maps/src/mapFontAssetFormat.cpp \
            tools/tests/test_map_transfer.cpp \
            -o /tmp/test_map_transfer
          /tmp/test_map_transfer
      - name: Map stream format host tests
        run: |
          g++ -std=c++17 \
            lib/map_transfer/map_transfer.cpp \
            lib/maps/src/mapBlockFormat.cpp \
            lib/maps/src/mapLabelBlock.cpp \
            lib/maps/src/mapFontAsset.cpp \
            lib/maps/src/mapFontAssetFormat.cpp \
            lib/map_transfer/map_stream_format.cpp \
            lib/map_transfer/map_stream_crypto.cpp \
            lib/map_transfer/map_stream_sha.cpp \
            lib/map_transfer/map_stream_trust.cpp \
            lib/map_transfer/map_stream_parser.cpp \
            tools/tests/test_map_stream_format.cpp \
            $(pkg-config --cflags --libs mbedcrypto) \
            -o /tmp/test_map_stream_format
          /tmp/test_map_stream_format
          g++ -std=c++17 -Wall -Wextra -Werror \
            lib/map_transfer/map_transfer.cpp \
            lib/map_transfer/map_stream_format.cpp \
            lib/map_transfer/map_stream_crypto.cpp \
            lib/map_transfer/map_stream_sha.cpp \
            lib/map_transfer/map_stream_trust.cpp \
            lib/map_transfer/map_stream_parser.cpp \
            lib/map_transfer/map_stream_install.cpp \
            lib/map_transfer/map_stream_receiver.cpp \
            lib/map_transfer/map_stream_compiled_trust.cpp \
            lib/maps/src/mapBlockFormat.cpp \
            lib/maps/src/mapLabelBlock.cpp \
            lib/maps/src/mapFontAsset.cpp \
            lib/maps/src/mapFontAssetFormat.cpp \
            tools/tests/test_map_stream_install.cpp \
            $(pkg-config --cflags --libs mbedcrypto) \
            -o /tmp/test_map_stream_install
          /tmp/test_map_stream_install
      - name: Transfer control dispatch host tests
        run: |
          g++ -std=c++17 \
            tools/tests/test_transfer_control_dispatch.cpp \
            -o /tmp/test_transfer_control_dispatch
          /tmp/test_transfer_control_dispatch
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_transfer_status_chunk_session.cpp \
            -o /tmp/test_map_transfer_status_chunk_session
          /tmp/test_map_transfer_status_chunk_session
      - name: Device transfer HTTP limit host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_device_transfer_http_limits.cpp \
            -o /tmp/test_device_transfer_http_limits
          /tmp/test_device_transfer_http_limits
          python -m unittest tools.tests.test_map_activation_handoff
      - name: Sound protocol host tests
        run: |
          g++ -std=c++17 \
            tools/tests/test_sound_protocol.cpp \
            -o /tmp/test_sound_protocol
          /tmp/test_sound_protocol
      - name: Codec recovery host tests
        run: |
          cc -std=c11 -Wall -Wextra \
            -Itools/tests/host_stubs \
            -Ilib/esp_codec_dev/src \
            tools/tests/test_codec_open.c \
            lib/esp_codec_dev/src/esp_codec_dev.c \
            -lm \
            -o /tmp/test_codec_open
          /tmp/test_codec_open
          cc -std=c11 -Wall -Wextra \
            -Itools/tests/host_stubs \
            -Ilib/esp_codec_dev/src \
            tools/tests/test_es8311_recovery.c \
            lib/esp_codec_dev/src/esp_codec_dev_vol.c \
            -lm \
            -o /tmp/test_es8311_recovery
          /tmp/test_es8311_recovery

  map-platform:
    name: Map Platform
    needs: changes
    if: >-
      needs.changes.outputs.map_backend == 'true' ||
      needs.changes.outputs.osm == 'true'
    permissions:
      attestations: read
      contents: read
      packages: read
    uses: ./.github/workflows/map-platform-ci.yml
    with:
      run_backend: ${{ needs.changes.outputs.map_backend == 'true' }}
      run_osm: ${{ needs.changes.outputs.osm == 'true' }}

  gate:
    name: >-
      ${{ (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' ||
      (inputs.scope == 'map' && github.ref ==
      'refs/heads/deploy/map-platform-production')) && 'CI Gate' ||
      format('Manual CI Gate ({0})', inputs.scope) }}
    needs:
      - changes
      - esp32
      - esp32-host
      - ios
      - map-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected component
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ESP32_RESULT: ${{ needs.esp32.result }}
          FIRMWARE_CHANGED: ${{ needs.changes.outputs.firmware }}
          HOST_RESULT: ${{ needs.esp32-host.result }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
          MAP_BACKEND_CHANGED: ${{ needs.changes.outputs.map_backend }}
          MAP_RESULT: ${{ needs.map-platform.result }}
          OSM_CHANGED: ${{ needs.changes.outputs.osm }}
        run: |
          require_result() {
            label="$1"
            actual="$2"
            expected="$3"
            if test "$actual" != "$expected"; then
              echo "::error::${label} result was ${actual}; expected ${expected}"
              exit 1
            fi
          }

          require_result "CI component selection" "$CHANGES_RESULT" success

          if test "$FIRMWARE_CHANGED" = true; then
            require_result "ESP32 builds" "$ESP32_RESULT" success
            require_result "ESP32 host tests" "$HOST_RESULT" success
          else
            require_result "ESP32 builds" "$ESP32_RESULT" skipped
            require_result "ESP32 host tests" "$HOST_RESULT" skipped
          fi

          if test "$IOS_CHANGED" = true; then
            require_result "iOS" "$IOS_RESULT" success
          else
            require_result "iOS" "$IOS_RESULT" skipped
          fi

          if test "$MAP_BACKEND_CHANGED" = true || test "$OSM_CHANGED" = true; then
            require_result "Map Platform" "$MAP_RESULT" success
          else
            require_result "Map Platform" "$MAP_RESULT" skipped
          fi
