name: Apply navigation render-ahead patch

on:
  push:
    branches:
      - agent/navigation-render-ahead

permissions:
  contents: write

concurrency:
  group: apply-navigation-render-ahead
  cancel-in-progress: true

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-navigation-patch]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify prepared patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          patch_dir = Path('.github/navigation-patch')
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          chunk_names = [
              'chunk-00',
              'chunk-01a',
              'chunk-01b',
              'chunk-01c0',
              'chunk-01c10',
              'chunk-01c11',
              'chunk-01c12',
              'chunk-01c13',
              'chunk-01c2',
              'chunk-01c3',
              'chunk-02',
              'chunk-03a-fixed',
              'chunk-03b',
              'chunk-03c',
              'chunk-04a',
              'chunk-04b',
              'chunk-04c',
              'chunk-05a',
              'chunk-05b',
              'chunk-05c',
              'chunk-06a',
              'chunk-06b',
              'chunk-06c',
              'chunk-07a',
              'chunk-07b',
              'chunk-07c',
              'chunk-08a',
              'chunk-08b',
              'chunk-08c',
          ]

          def compact_text(path: Path) -> str:
              return ''.join(path.read_text(encoding='utf-8').split())

          def verify(data: bytes, expected: str, label: str) -> None:
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f'{label} SHA-256 mismatch: expected {expected}, got {actual}'
                  )
              print(f'{label}: OK ({actual})')

          original_b64_text = ''.join(
              compact_text(patch_dir / name) for name in chunk_names
          )
          original_b64 = original_b64_text.encode('ascii')
          verify(
              original_b64,
              'b7a4525df7bd077da0360afacdb6421ebdbe048f0410c778fc29fbed109359b8',
              'original base64',
          )
          original_gz = base64.b64decode(original_b64, validate=True)
          verify(
              original_gz,
              'cef6fd83928789e176c08bda89b5ed5facea775eafe36f83d121d06bed62a489',
              'original gzip',
          )
          original_patch = gzip.decompress(original_gz)
          verify(
              original_patch,
              'f5396a9ce91b2652e19fc91b5f195cae6d8c32e0cf72e76655243e302bb58af2',
              'original patch',
          )
          (runner_temp / 'navigation.patch').write_bytes(original_patch)

          memory_b64_text = compact_text(
              patch_dir / 'maps-memory-integration-v2'
          )
          memory_b64 = memory_b64_text.encode('ascii')
          verify(
              memory_b64,
              'e880da562e25e26f524b8e6339a33b735c955d7e980b0ee12226722a75c57f1d',
              'memory integration base64',
          )
          memory_gz = base64.b64decode(memory_b64, validate=True)
          verify(
              memory_gz,
              'f772ee5c5dfce0910e468b3956e8f2c6167cb7eda13c3223789078a102abf72f',
              'memory integration gzip',
          )
          memory_patch = gzip.decompress(memory_gz)
          verify(
              memory_patch,
              '1e2d89cd90de082ad27a02e5293b952fee076f54d8e52ccdcc2c0fd599867d7e',
              'memory integration patch',
          )
          (runner_temp / 'maps-memory-v2.patch').write_bytes(memory_patch)
          PY

      - name: Rebuild cleanly on current main
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_PATCH="$RUNNER_TEMP/navigation.patch"
          MEMORY_PATCH="$RUNNER_TEMP/maps-memory-v2.patch"
          OLD_BASE_WORKTREE="$RUNNER_TEMP/navigation-old-base"

          git fetch origin main
          CURRENT_MAIN=$(git rev-parse origin/main)
          echo "Rebuilding on current main: $CURRENT_MAIN"
          git reset --hard origin/main

          # Apply every prepared change except maps.cpp directly to current main.
          # --3way preserves independent main changes such as PR #202's CI test.
          git apply --index --3way \
            --exclude=esp32/lib/maps/src/maps.cpp \
            "$ORIGINAL_PATCH"

          # Reproduce the renderer from its exact package-time base, then layer
          # the deterministic PR #202 diagnostic integration before copying it
          # into the current-main tree.
          git worktree add --detach "$OLD_BASE_WORKTREE" \
            951a51089197c4ef58374c452d320c73fb3a7f03
          git -C "$OLD_BASE_WORKTREE" apply \
            --include=esp32/lib/maps/src/maps.cpp \
            "$ORIGINAL_PATCH"
          git -C "$OLD_BASE_WORKTREE" apply "$MEMORY_PATCH"
          cp "$OLD_BASE_WORKTREE/esp32/lib/maps/src/maps.cpp" \
            esp32/lib/maps/src/maps.cpp
          git worktree remove --force "$OLD_BASE_WORKTREE"

          git add -A
          git diff --cached --check

      - name: Run focused executable contracts
        shell: bash
        run: |
          set -euo pipefail
          cd esp32
          OUT="$RUNNER_TEMP/navigation-host-tests"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "runner architecture: $(uname -m)"
          uname -a
          command -v g++
          g++ --version

          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('tools/tests/test_map_pinch_zoom.cpp')
          data = path.read_bytes()
          expected = '76468d07ea9e053983295bcfef3a29b6c69716970baa972045183ab66937741d'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(
                  f'pinch source SHA-256 mismatch: expected {expected}, got {actual}'
              )
          if b'currentZoom' in data:
              raise SystemExit('unexpected currentZoom source in pinch test')
          print(f'pinch source: OK ({actual})')
          PY
          nl -ba tools/tests/test_map_pinch_zoom.cpp | sed -n '75,90p'

          for test in \
            test_map_render_job \
            test_map_presentation \
            test_map_building_admission \
            test_map_route_geometry \
            test_map_building_workspace \
            test_map_building_renderer \
            test_map_render_policy \
            test_map_projection \
            test_line_rasterizer \
            test_workout_telemetry_state; do
            g++ -std=c++17 -Wall -Wextra -Werror \
              "tools/tests/${test}.cpp" -o "$OUT/${test}"
            "$OUT/${test}"
          done

          PINCH_BIN="$OUT/test_map_pinch_zoom-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_pinch_zoom.cpp -o "$PINCH_BIN"
          python3 - "$PINCH_BIN" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = path.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          print(f'pinch binary SHA-256: {digest}')
          if b'currentZoom' in data:
              raise SystemExit(
                  'compiled pinch binary contains an impossible stale assertion'
              )
          PY
          file "$PINCH_BIN"
          "$PINCH_BIN"

          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/tests/test_map_block_format.cpp \
            lib/maps/src/mapBlockFormat.cpp \
            lib/maps/src/mapBuildingBlock.cpp \
            -o "$OUT/test_map_block_format"
          "$OUT/test_map_block_format"
          PYTHONPATH=. python3 -m unittest \
            tools.tests.test_map_guidance_integration \
            tools.tests.test_map_activation_handoff \
            tools.tests.test_map_memory_diagnostics

      - name: Publish one clean commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email openai@example.invalid
          git commit -m "Rebuild navigation map rendering with latest-wins worker"
          git push \
            --force-with-lease=refs/heads/agent/navigation-render-ahead:${GITHUB_SHA} \
            origin HEAD:refs/heads/agent/navigation-render-ahead
