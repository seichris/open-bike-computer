name: World Radio integration probe 2

on:
  push:
    branches:
      - feature/world-radio-screen

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[world-radio-probe2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/world-radio-screen
      - name: Capture exact write and settings anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          requests = {
              "ios-app/BikeComputer/BikeComputer/Managers/BLEManager.swift": [
                  "sendFallback",
                  "onWorkoutStartRequest",
                  "onDestinationRequest",
                  "supportsBatteryStatusScreen",
                  "enum DeviceScreen",
                  "effectiveEnabledDeviceScreensMask",
                  "supportedDeviceScreensMask",
                  "sendEnabledDeviceScreens",
                  "sendDefaultDeviceScreen",
                  "enabledDeviceScreensMask",
                  "func sendSetting",
              ],
              "ios-app/BikeComputer/BikeComputer/Info.plist.template": [
                  "UIBackgroundModes",
              ],
              "esp32/lib/ble_navigation/ble_navigation.hpp": [
                  "enum DeviceScreenSetting",
                  "class BLENavigationServer",
                  "requestDestinationRoute",
              ],
              "esp32/lib/ble_navigation/ble_navigation.cpp": [
                  "class MyNavCharacteristicCallbacks",
                  "void onWrite(NimBLECharacteristic *pChar) override",
                  "disconnectActive",
              ],
              "esp32/lib/gui/src/mainScr.cpp": [
                  "case BATTERY_STATUS",
                  "batteryStatusTile =",
              ],
          }

          out = []
          for filename, needles in requests.items():
              path = Path(filename)
              lines = path.read_text().splitlines()
              out.append(f"\n===== {filename} ({len(lines)} lines) =====")
              for needle in needles:
                  matches = [i for i, line in enumerate(lines) if needle in line]
                  out.append(f"\n--- {needle!r}: {matches} ---")
                  for i in matches[:12]:
                      start = max(0, i - 25)
                      end = min(len(lines), i + 75)
                      for n in range(start, end):
                          out.append(f"{n + 1:05d}: {lines[n]}")
                      out.append("--- end context ---")

          Path("tools/world-radio-probe2.txt").write_text("\n".join(out) + "\n")
          PY
      - name: Commit report and remove probe workflow
        run: |
          rm .github/workflows/world-radio-probe2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[world-radio-probe2] capture write paths"
          git push origin HEAD:feature/world-radio-screen
