name: Publish reviewed diagnostics source

on:
  push:
    branches: [implement/wifi-device-operation-lifecycle]
    paths: [.github/workflows/diagnostics-apply-reviewed-patch.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'seichris/open-bike-computer' && github.ref == 'refs/heads/implement/wifi-device-operation-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify and publish exact reviewed source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/diagnostics-reviewed/apply.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication.json
          retention-days: 1
          if-no-files-found: error
