name: Map Platform CI

on:
  workflow_call:
    inputs:
      run_backend:
        description: Validate the backend, deployment, and production image
        required: true
        type: boolean
      run_osm:
        description: Validate the OSM extraction toolchain
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      run_backend:
        description: Validate the backend, deployment, and production image
        required: true
        default: true
        type: boolean
      run_osm:
        description: Validate the OSM extraction toolchain
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  catalog:
    name: Cloudflare Map Catalog
    if: inputs.run_backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map-platform/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: map-platform/catalog/pnpm-lock.yaml
      - name: Install catalog dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test, and dry-run both environments
        run: pnpm check

  osm:
    name: OSM Pipeline
    if: inputs.run_osm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/OSM_Extract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: >-
          python -m pip install --upgrade
          pillow pyyaml shapely==2.0.7 freetype-py uharfbuzz osmium==4.3.1
      - name: Python syntax
        run: |
          python -m py_compile \
            scripts/building_height.py \
            scripts/building_block_cache.py \
            scripts/building_pipeline.py \
            scripts/extract_features.py \
            scripts/extract_building_relations.py \
            scripts/block_progress.py \
            scripts/feature_types.py \
            scripts/font_asset.py \
            scripts/funcs.py \
            scripts/label_pipeline.py \
            scripts/map_format.py \
            tests/test_config.py \
            tests/test_building_height.py \
            tests/test_building_block_cache.py \
            tests/test_building_relations.py \
            tests/test_building_pipeline.py \
            tests/test_feature_types.py \
            tests/test_font_asset.py \
            tests/test_label_pipeline.py \
            tests/test_map_format.py \
            tests/test_target3_cli.py
      - name: YAML/config tests
        run: python -m unittest discover -s tests
      - name: Shell syntax
        run: bash -n scripts/pbf_to_geojson.sh
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./tools/OSM_Extract/scripts
      - name: Compose config
        run: docker compose config
      - name: Build tools image
        run: docker compose build tools
      - name: Smoke test tools image
        run: docker compose run --rm tools python -c "import mapnik; import matplotlib; import osmium; import shapely; import yaml; from osgeo import ogr"

  backend:
    name: Map Backend
    if: inputs.run_backend
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      packages: read
    defaults:
      run:
        working-directory: map-platform/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install backend test dependencies
        run: python -m pip install -e '.[test,object-storage]'
      - name: Python syntax
        run: >-
          python -m py_compile
          map_platform/*.py
          tests/*.py
          tools/check_r2_compatibility.py
          ../deploy/*.py
          ../deploy/tests/*.py
      - name: Generated map stream trust registry
        run: |
          python tools/generate_map_stream_trust.py --check
          python tools/check_map_stream_hardware_gate.py --validate-requirements
      - name: Unit tests
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s ../deploy/tests
      - name: Production promotion scheduler image
        working-directory: .
        run: >-
          docker build --platform linux/amd64 --target validation
          -f map-platform/deploy/promotion/Dockerfile .

      - name: Production authentication compatibility image
        working-directory: .
        run: >-
          docker build --platform linux/amd64 --target validation
          -f map-platform/deploy/compatibility/Dockerfile .
      - name: Production Compose config
        env:
          MAP_PLATFORM_DOWNLOAD_SECRET: ci-download-secret
          MAP_PLATFORM_INSTALLATION_SECRET: ci-installation-secret-32-bytes-minimum
          MAP_PLATFORM_TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
          MAP_PLATFORM_MAINTENANCE_INTERVAL_SECONDS: "86400"
        run: docker compose config
      - name: GitOps deployment Compose configs
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_PLATFORM_DOWNLOAD_SECRET: ci-download-secret
          MAP_PLATFORM_INSTALLATION_SECRET: ci-installation-secret-32-bytes-minimum
          MAP_PLATFORM_TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
          MAP_PLATFORM_MAINTENANCE_INTERVAL_SECONDS: "86400"
        run: |
          docker compose -f ../deploy/compose.yaml config
          docker compose -f ../deploy/compose.development.yaml config
          python ../deploy/verify_registry_images.py \
            ../deploy/compose.yaml
          python ../deploy/verify_registry_images.py \
            ../deploy/compose.development.yaml
      - name: Build backend production image
        run: >-
          docker build
          --file Dockerfile
          --tag open-bike-map-platform-ci
          ../..
      - name: Smoke-start backend production image
        run: >-
          docker run --rm
          -e MAP_PLATFORM_DOWNLOAD_SECRET=ci-download-secret
          -e MAP_PLATFORM_INSTALLATION_SECRET=ci-installation-secret-32-bytes-minimum
          -e MAP_PLATFORM_DATA_ROOT=/tmp/map-platform-data
          open-bike-map-platform-ci
          python -c "import osmium; from pathlib import Path; from map_platform.api import create_app; from map_platform.map_stream_build_identity import verify_map_stream_build_identity; identity = verify_map_stream_build_identity(Path('/app/map-platform/config/map-stream-build-identity.json'), Path('/app')); assert len(identity.producer_build_sha256) == 64; app = create_app(); assert app.title"
      - name: Smoke worker heartbeat
        run: >-
          docker run --rm
          -e MAP_PLATFORM_DATA_ROOT=/tmp/map-platform-data
          -e MAP_PLATFORM_WORKER_HEARTBEAT_PATH=/tmp/map-platform-data/health/worker
          open-bike-map-platform-ci
          bash -ec 'map-platform worker-loop --idle-sleep-seconds 0.1 & worker=$!;
          for attempt in {1..50}; do test -s /tmp/map-platform-data/health/worker && break; sleep 0.1; done;
          test -s /tmp/map-platform-data/health/worker; kill "$worker"; wait "$worker" || true'
