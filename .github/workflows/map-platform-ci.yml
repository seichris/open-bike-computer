name: Map Platform CI

on:
  push:
    paths:
      - ".dockerignore"
      - ".github/workflows/map-platform-ci.yml"
      - ".github/workflows/map-platform-image.yml"
      - "map-platform/backend/**"
      - "map-platform/config/map-stream-hardware-gate.json"
      - "map-platform/config/map-stream-rollout-approvals.json"
      - "map-platform/config/map-stream-trust.json"
      - "map-platform/deploy/**"
      - "tools/OSM_Extract/**"
  # Keep the Map Backend check present on every pull request because repository
  # protection requires that status. Push builds remain path-filtered.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osm:
    name: OSM Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/OSM_Extract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml shapely freetype-py uharfbuzz
      - name: Python syntax
        run: |
          python -m py_compile \
            scripts/extract_features.py \
            scripts/block_progress.py \
            scripts/feature_types.py \
            scripts/font_asset.py \
            scripts/funcs.py \
            scripts/label_pipeline.py \
            scripts/map_format.py \
            tests/test_config.py \
            tests/test_feature_types.py \
            tests/test_font_asset.py \
            tests/test_label_pipeline.py \
            tests/test_map_format.py
      - name: YAML/config tests
        run: python -m unittest discover -s tests
      - name: Shell syntax
        run: bash -n scripts/pbf_to_geojson.sh
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./tools/OSM_Extract/scripts
      - name: Compose config
        run: docker compose config
      - name: Build tools image
        run: docker compose build tools
      - name: Smoke test tools image
        run: docker compose run --rm tools python -c "import mapnik; import matplotlib; import shapely; import yaml; from osgeo import ogr"

  backend:
    name: Map Backend
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      packages: read
    defaults:
      run:
        working-directory: map-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Install backend test dependencies
        run: python -m pip install -e '.[test,object-storage]'
      - name: Python syntax
        run: >-
          python -m py_compile
          map_platform/*.py
          tests/*.py
          ../deploy/*.py
          ../deploy/tests/*.py
      - name: Generated map stream trust registry
        run: |
          python tools/generate_map_stream_trust.py --check
          python tools/check_map_stream_hardware_gate.py --validate-requirements
      - name: Unit tests
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s ../deploy/tests
      - name: Production Compose config
        env:
          MAP_PLATFORM_DOWNLOAD_SECRET: ci-download-secret
          MAP_PLATFORM_INSTALLATION_SECRET: ci-installation-secret-32-bytes-minimum
          MAP_PLATFORM_TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
          MAP_PLATFORM_MAINTENANCE_INTERVAL_SECONDS: "86400"
        run: docker compose config
      - name: GitOps production Compose config
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_PLATFORM_DOWNLOAD_SECRET: ci-download-secret
          MAP_PLATFORM_INSTALLATION_SECRET: ci-installation-secret-32-bytes-minimum
          MAP_PLATFORM_TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
          MAP_PLATFORM_MAINTENANCE_INTERVAL_SECONDS: "86400"
        run: |
          docker compose -f ../deploy/compose.yaml config
          python ../deploy/verify_registry_images.py \
            ../deploy/compose.yaml
      - name: Build backend production image
        run: >-
          docker build
          --file Dockerfile
          --tag open-bike-map-platform-ci
          ../..
      - name: Smoke-start backend production image
        run: >-
          docker run --rm
          -e MAP_PLATFORM_DOWNLOAD_SECRET=ci-download-secret
          -e MAP_PLATFORM_INSTALLATION_SECRET=ci-installation-secret-32-bytes-minimum
          -e MAP_PLATFORM_DATA_ROOT=/tmp/map-platform-data
          open-bike-map-platform-ci
          python -c "from pathlib import Path; from map_platform.api import create_app; from map_platform.map_stream_build_identity import verify_map_stream_build_identity; identity = verify_map_stream_build_identity(Path('/app/map-platform/config/map-stream-build-identity.json'), Path('/app')); assert len(identity.producer_build_sha256) == 64; app = create_app(); assert app.title"
      - name: Smoke worker heartbeat
        run: >-
          docker run --rm
          -e MAP_PLATFORM_DATA_ROOT=/tmp/map-platform-data
          -e MAP_PLATFORM_WORKER_HEARTBEAT_PATH=/tmp/map-platform-data/health/worker
          open-bike-map-platform-ci
          bash -ec 'map-platform worker-loop --idle-sleep-seconds 0.1 & worker=$!;
          for attempt in {1..50}; do test -s /tmp/map-platform-data/health/worker && break; sleep 0.1; done;
          test -s /tmp/map-platform-data/health/worker; kill "$worker"; wait "$worker" || true'
