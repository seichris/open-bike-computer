name: Zone macro-safe firmware validation
on:
  push:
    branches: [work/zone-device-transport-20260915]
    paths: [.github/workflows/zone-device-workspace.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: publish
        name: Apply generated macro-safe identifier fix
        shell: bash
        run: |
          set -euo pipefail
          cp tools/zone-workspace/firmware-version.patch "$RUNNER_TEMP/version.patch"
          git fetch origin feat/native-healthkit-workout-zones
          test "$(git rev-parse FETCH_HEAD)" = 8b77ab9d455c93460d7c8c0d358a93fbce5f6345
          git switch --detach FETCH_HEAD
          git apply --check "$RUNNER_TEMP/version.patch"
          git apply --index "$RUNNER_TEMP/version.patch"
          git diff --cached --check
          python3 tools/generate_ride_ble_contract.py --check
          for board in WAVESHARE_AMOLED_175 WAVESHARE_AMOLED_206; do
            g++ -std=c++17 -Wall -Wextra -Werror -O1 -D"$board" esp32/tools/tests/test_workout_zone_protocol.cpp -o "$RUNNER_TEMP/zone-test"
            "$RUNNER_TEMP/zone-test"
          done
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Avoid firmware VERSION macro in generated zone protocol and add compile regression'
          git push origin HEAD:refs/heads/feat/native-healthkit-workout-zones
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  firmware:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [WAVESHARE_AMOLED_175, WAVESHARE_AMOLED_206]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Full build through repository-owned runtime, no upload
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/zone-firmware"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-firmware/SHA"
          cd esp32
          env -u LD_LIBRARY_PATH python3 tools/build_firmware.py "$TARGET" 2>&1 | tee "$RUNNER_TEMP/zone-firmware/build.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zone-macro-safe-${{ matrix.target }}
          path: ${{ runner.temp }}/zone-firmware
          retention-days: 7
