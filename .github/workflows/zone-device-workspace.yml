name: Zone preview integration inputs
on:
  push:
    branches: [work/zone-device-transport-20260915]
    paths: [.github/workflows/zone-device-workspace.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 73b5d5eed16f5cf46e749fa034d4c47298da5134
          persist-credentials: false
      - name: Archive exact source and pinned renderer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zone-preview-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-preview-inputs/SHA"
          git archive --format=tar.gz -o "$RUNNER_TEMP/zone-preview-inputs/source.tar.gz" HEAD
          git clone --filter=blob:none --no-checkout https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
          git -C "$RUNNER_TEMP/lvgl" checkout --detach 7f07a129e8d77f4984fff8e623fd5be18ff42e74
          git -C "$RUNNER_TEMP/lvgl" archive --format=tar.gz -o "$RUNNER_TEMP/zone-preview-inputs/lvgl.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zone-preview-inputs
          path: ${{ runner.temp }}/zone-preview-inputs
          retention-days: 2
