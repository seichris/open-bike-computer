name: Zone capability regression validation
on:
  push:
    branches: [work/zone-device-transport-20260915]
    paths: [.github/workflows/zone-device-workspace.yml]
permissions:
  contents: read
jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: publish
        name: Update explicit capability contract assertion
        shell: bash
        run: |
          set -euo pipefail
          cp tools/zone-workspace/capability-test.patch "$RUNNER_TEMP/test.patch"
          git fetch origin feat/native-healthkit-workout-zones
          test "$(git rev-parse FETCH_HEAD)" = 7457c8be8150f63c72c4f4eb7f8215bc940220c6
          git switch --detach FETCH_HEAD
          git apply --check "$RUNNER_TEMP/test.patch"
          git apply --index "$RUNNER_TEMP/test.patch"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Test negotiated workout zone protocol and preserve all prior capability assertions'
          git push origin HEAD:refs/heads/feat/native-healthkit-workout-zones
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  swift-tests:
    needs: publish-test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish-test.outputs.sha }}
          persist-credentials: false
      - name: Complete Swift helper suite
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/zone-final-tests"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-final-tests/SHA"
          ./ios-app/scripts/run-navigation-tests.sh 2>&1 | tee "$RUNNER_TEMP/zone-final-tests/navigation.log"
      - name: Actual Watch BLE adapter lifecycle tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 ios-app/tests/watch-link-host/run.py 2>&1 | tee "$RUNNER_TEMP/zone-final-tests/watch-adapter.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zone-final-swift-tests
          path: ${{ runner.temp }}/zone-final-tests
          retention-days: 7
