name: Zone device implementation validation
on:
  push:
    branches: [work/zone-device-transport-20260915]
    paths: [.github/workflows/zone-device-workspace.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply exact reviewed patch to unchanged PR head
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/zones.patch" <<'PY'
          import base64, hashlib, lzma, pathlib, sys
          parts = [pathlib.Path(f'tools/zone-workspace/patch-{i}.b64').read_text().strip() for i in range(4)]
          encoded = ''.join(parts)
          if len(encoded) != 42744:
              raise SystemExit('Patch transport length mismatch')
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = '49da835bd1baac3bd8da25001a485544236b5606b952f02935402c5b4ef5f787'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch transport digest mismatch')
          pathlib.Path(sys.argv[1]).write_bytes(patch)
          PY
          git fetch origin feat/native-healthkit-workout-zones
          test "$(git rev-parse FETCH_HEAD)" = 5a6c83a0729c5ef99168631b5999fac2e786919d
          git switch --detach FETCH_HEAD
          git apply --check "$RUNNER_TEMP/zones.patch"
          git apply --index "$RUNNER_TEMP/zones.patch"
          git diff --cached --check
          python3 tools/generate_ride_ble_contract.py --check
      - name: Verify C++ decoder, display and legacy contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in test_workout_telemetry_protocol test_workout_telemetry_state test_workout_zone_protocol test_gui_layout test_ride_stats_widget test_screen_configuration_protocol test_screen_configuration_policy test_device_capabilities_protocol test_ride_delivery_protocol test_scoped_watch_payload_policy test_ride_controller_lease; do
            g++ -std=c++17 -Wall -Wextra -Werror -O1 "esp32/tools/tests/$test.cpp" -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
            echo "PASS $test"
          done
          g++ -std=c++17 -Wall -Wextra -Werror -DWAVESHARE_AMOLED_206 esp32/tools/tests/test_gui_layout.cpp -o "$RUNNER_TEMP/layout-206"
          "$RUNNER_TEMP/layout-206"
          g++ -std=c++17 -Wall -Wextra -Werror -DFIRMWARE_DIAGNOSTICS=1 esp32/tools/tests/test_screen_configuration_protocol.cpp -o "$RUNNER_TEMP/widgets-diagnostic"
          "$RUNNER_TEMP/widgets-diagnostic"
      - id: publish
        name: Fast-forward existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add versioned HR and power zone device telemetry with iOS 26 compatibility'
          git push origin HEAD:refs/heads/feat/native-healthkit-workout-zones
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  apple-tests:
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Record exact source and toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/zone-validation"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-validation/SHA"
          ls -d /Applications/Xcode*.app > "$RUNNER_TEMP/zone-validation/xcodes.txt"
          xcrun swift --version > "$RUNNER_TEMP/zone-validation/swift.txt"
          xcrun --sdk watchsimulator --show-sdk-version > "$RUNNER_TEMP/zone-validation/watch-sdk.txt"
      - name: Native zone regression tests
        run: |
          set -o pipefail
          ./ios-app/scripts/run-native-workout-zone-tests.sh 2>&1 | tee "$RUNNER_TEMP/zone-validation/native-tests.log"
      - name: Existing workout contracts
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ./ios-app/scripts/run-workout-contract-tests.sh 2>&1 | tee "$RUNNER_TEMP/zone-validation/workout-tests.log"
      - name: Swift helper and real Watch adapter tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ./ios-app/scripts/run-navigation-tests.sh 2>&1 | tee "$RUNNER_TEMP/zone-validation/navigation-tests.log"
      - name: Complete Watch source graph
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ./ios-app/scripts/run-watch-source-typecheck.sh 2>&1 | tee "$RUNNER_TEMP/zone-validation/watch-typecheck.log"
      - name: Script and release configuration tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cd ios-app
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests 2>&1 | tee "$RUNNER_TEMP/zone-validation/python-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zone-device-apple-tests
          path: ${{ runner.temp }}/zone-validation
          retention-days: 7
  apple-build:
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Unsigned app and embedded Watch build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/zone-build"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-build/SHA"
          xcrun swift --version > "$RUNNER_TEMP/zone-build/swift.txt"
          xcrun --sdk iphoneos --show-sdk-version > "$RUNNER_TEMP/zone-build/ios-sdk.txt"
          cd ios-app
          ./scripts/xcodebuild-cli.sh -project BikeComputer/BikeComputer.xcodeproj -scheme BikeComputer -configuration "$CONFIGURATION" -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/zone-derived" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/zone-build/build.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zone-device-build-${{ matrix.configuration }}
          path: ${{ runner.temp }}/zone-build
          retention-days: 7
  firmware:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [WAVESHARE_AMOLED_175, WAVESHARE_AMOLED_206]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Build only with repository-owned runtime
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/zone-firmware"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-firmware/SHA"
          cd esp32
          env -u LD_LIBRARY_PATH python3 tools/build_firmware.py "$TARGET" 2>&1 | tee "$RUNNER_TEMP/zone-firmware/build.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zone-device-firmware-${{ matrix.target }}
          path: ${{ runner.temp }}/zone-firmware
          retention-days: 7
