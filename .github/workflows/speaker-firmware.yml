name: Speaker firmware builds

on:
  workflow_dispatch:

jobs:
  esp32-speaker:
    name: ESP32 Speaker (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - WAVESHARE_AMOLED_175_SPEAKER_HONK
          - WAVESHARE_AMOLED_206_SPEAKER_HONK
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@v7
      - name: Restore pinned PlatformIO downloads
        uses: actions/cache@v6
        with:
          path: esp32/.pio/open-bike-build/downloads
          key: esp32-pinned-downloads-${{ runner.os }}-${{ hashFiles('esp32/tools/generated_sdkconfig.py') }}
      - name: Build with the repository-owned firmware runtime
        run: env -u LD_LIBRARY_PATH python3 tools/build_firmware.py "${{ matrix.target }}"
