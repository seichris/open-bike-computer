name: Migrate existing firmware signing key

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare an encrypted copy, or verify the installed environment copy (never deletes originals)
        required: true
        type: choice
        options:
          - prepare
          - verify

permissions:
  contents: read

concurrency:
  group: firmware-key-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.repository == 'seichris/open-bike-computer' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '25006584' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The source environment has no firmware scalar override. The verification
    # job deliberately uses the destination environment's copy instead.
    environment: ${{ inputs.operation == 'prepare' && 'firmware-runtime-publication' || 'firmware-release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install content-locked signing dependencies before exposing any key
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps
          -r tools/firmware-signing-requirements.txt
      - id: preflight-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FIRMWARE_RELEASE_PREFLIGHT_APP_ID }}
          private-key: ${{ secrets.FIRMWARE_RELEASE_PREFLIGHT_APP_PRIVATE_KEY }}
          owner: seichris
          repositories: open-bike-computer
          permission-administration: read
          permission-environments: read
          permission-secrets: read
          permission-contents: read
          permission-actions: read
      - name: Seal or prove the existing key without publishing firmware
        env:
          GH_TOKEN: ${{ steps.preflight-token.outputs.token }}
          MIGRATION_SIGNING_KEY: ${{ secrets.FIRMWARE_MANIFEST_SIGNING_PRIVATE_KEY }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python .github/scripts/firmware_key_migration.py "${MIGRATION_OPERATION}" \
            --output "${RUNNER_TEMP}/firmware-key-migration/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-key-migration-${{ github.run_id }}-${{ inputs.operation }}
          path: ${{ runner.temp }}/firmware-key-migration/receipt.json
          if-no-files-found: error
          retention-days: 1
