name: World Radio integration probe

on:
  push:
    branches:
      - feature/world-radio-screen

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[world-radio-probe]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/world-radio-screen
      - name: Capture exact patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          requests = {
              "ios-app/BikeComputer/BikeComputer/Managers/BLEManager.swift": [
                  "private func handleNavigationCharacteristicNotification",
                  "func handleDeviceCapabilitiesNotification",
                  "supportsRideDeliveryAcknowledgement =",
                  "private func rejectDeviceCapabilities",
              ],
              "esp32/lib/ble_navigation/ble_navigation.cpp": [
                  "bool requestDestinationRoute",
                  "notifyAuthenticatedNavigation",
                  "class NavigationCallbacks",
                  "CAPABILITY_SCHEMA_VERSION",
                  "pNavCharacteristic =",
              ],
              "esp32/lib/gui/src/mainScr.cpp": [
                  "static void showMainTile",
                  "void updateMainScreen",
                  "void createMainScr",
                  "void showNextMainScreen",
              ],
              "ios-app/BikeComputer/BikeComputer/Views/SettingsView.swift": [
                  "private struct DeviceScreensSettingsSection",
              ],
              "esp32/lib/ble_navigation/device_screen_protocol.hpp": [
                  "namespace device_screen_protocol",
              ],
          }

          out = []
          for filename, needles in requests.items():
              path = Path(filename)
              lines = path.read_text().splitlines()
              out.append(f"\n===== {filename} ({len(lines)} lines) =====")
              for needle in needles:
                  matches = [i for i, line in enumerate(lines) if needle in line]
                  out.append(f"\n--- {needle!r}: {matches} ---")
                  for i in matches[:4]:
                      start = max(0, i - 35)
                      end = min(len(lines), i + 90)
                      for n in range(start, end):
                          out.append(f"{n + 1:05d}: {lines[n]}")
                      out.append("--- end context ---")

          for info in sorted(Path("ios-app").rglob("*Info*.plist")):
              out.append(f"\n===== {info} =====")
              for n, line in enumerate(info.read_text().splitlines(), 1):
                  out.append(f"{n:05d}: {line}")

          Path("tools/world-radio-probe.txt").write_text("\n".join(out) + "\n")
          PY
      - name: Commit report and remove probe workflow
        run: |
          rm .github/workflows/world-radio-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[world-radio-probe] capture integration anchors"
          git push origin HEAD:feature/world-radio-screen
