name: Apply renderer replay window transport

on:
  push:
    branches:
      - fix/renderer-replay-window-transport

permissions:
  contents: write

concurrency:
  group: renderer-replay-window-transport
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: fix/renderer-replay-window-transport

      - name: Verify isolated exact-head bootstrap
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            10e0cd5320c6feeaeb46036f27a7adde091454e5 HEAD
          unexpected="$(git diff --name-only \
            10e0cd5320c6feeaeb46036f27a7adde091454e5..HEAD -- \
            ':(exclude).github/workflows/apply-renderer-replay-window-transport.yml' \
            ':(exclude).github/scripts/apply_renderer_replay_window_transport.py')"
          test -z "$unexpected" || {
            echo "::error::Unexpected pre-existing branch changes"
            printf '%s\n' "$unexpected"
            exit 1
          }
          echo \
            "f4eec9797291f4fea4470e6f0dca450da88d07d4a286aaf7a501447e803a2020  .github/scripts/apply_renderer_replay_window_transport.py" \
            | shasum -a 256 -c -

      - name: Apply deterministic source mutation
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_renderer_replay_window_transport.py
          git diff --check
          git status --short

      - name: Run iOS host regressions
        working-directory: ios-app
        run: ./scripts/run-navigation-tests.sh

      - name: Build unsigned Debug app
        working-directory: ios-app
        run: |
          ./scripts/xcodebuild-cli.sh \
            -project BikeComputer/BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/bike-computer-development" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate Debug app container
        working-directory: ios-app
        run: |
          bash ./scripts/verify-development-container.sh \
            "$RUNNER_TEMP/bike-computer-development/Build/Products/Debug-iphoneos/BikeComputer.app"

      - name: Build unsigned Release app
        working-directory: ios-app
        run: |
          ./scripts/xcodebuild-cli.sh \
            -project BikeComputer/BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/bike-computer-release" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-renderer-replay-window-transport.yml \
            .github/scripts/apply_renderer_replay_window_transport.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix renderer replay window transport"
          git push origin HEAD:fix/renderer-replay-window-transport
