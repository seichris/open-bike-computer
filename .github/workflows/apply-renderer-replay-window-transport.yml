PAYLOAD
          base64 --decode "$RUNNER_TEMP/mutation.py.gz.b64" \
            > "$RUNNER_TEMP/mutation.py.gz"
          gzip -dc "$RUNNER_TEMP/mutation.py.gz" \
            > "$RUNNER_TEMP/mutation.py"
          echo "$MUTATION_SHA256  $RUNNER_TEMP/mutation.py" | shasum -a 256 -c -
          python3 "$RUNNER_TEMP/mutation.py"
          git diff --check

      - name: Run focused iOS host regressions
        working-directory: ios-app
        run: ./scripts/run-navigation-tests.sh

      - name: Build unsigned Debug app
        working-directory: ios-app
        run: |
          ./scripts/xcodebuild-cli.sh \
            -project BikeComputer/BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/bike-computer-development" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate Debug app container
        working-directory: ios-app
        run: |
          bash ./scripts/verify-development-container.sh \
            "$RUNNER_TEMP/bike-computer-development/Build/Products/Debug-iphoneos/BikeComputer.app"

      - name: Build unsigned Release app
        working-directory: ios-app
        run: |
          ./scripts/xcodebuild-cli.sh \
            -project BikeComputer/BikeComputer.xcodeproj \
            -scheme BikeComputer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/bike-computer-release" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-renderer-replay-window-transport.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ios-app/BikeComputer/BikeComputer/Managers/BLEManager.swift \
            ios-app/BikeComputer/BikeComputer/Managers/RendererBenchmarkReplayCoordinator.swift \
            ios-app/BikeComputer/BikeComputer/Managers/SecureRendererBenchmarkController.swift \
            ios-app/BikeComputerTests/NavigationProtocolTests.swift
          git commit -m "Fix renderer replay window transport"
          git push origin HEAD:fix/renderer-replay-window-transport
