name: Export World Radio worktree

on:
  push:
    branches:
      - feature/world-radio-screen
    paths:
      - .github/workflows/export-world-radio-worktree.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/world-radio-screen
      - name: Package worktree
        run: tar --exclude=.git -czf /tmp/open-bike-computer-worktree.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-bike-computer-worktree
          path: /tmp/open-bike-computer-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
