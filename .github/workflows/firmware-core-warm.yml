name: Firmware core warm

# Pull requests can only restore Actions caches that their base branch created,
# and main never ran CI after a merge. This run builds the regular profiles of
# every board family through the normal firmware scope, so main publishes the
# verified core entries that every later pull request restores. Without it the
# 2.06, e-paper and GNSS builds of every pull request compile their cores cold.
on:
  push:
    branches:
      - main
    paths:
      - "esp32/**"
      - ".github/actions/firmware-build-cache/**"
      - ".github/actions/free-runner-disk/**"
      - ".github/scripts/firmware_core_artifact.py"
      - ".github/workflows/ci.yml"
      - ".github/workflows/firmware-core-warm.yml"
  schedule:
    # Refresh published entries before their 14-day retention lapses on a quiet main.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      firmware_hardware:
        description: Firmware hardware families to warm
        required: true
        default: every
        type: choice
        options:
          - every
          - "175"
          - "206"
          - "397"
          - "175_gnss"

# Read-only. Nested ci.yml jobs declare these even when the firmware scope skips them.
permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

concurrency:
  group: firmware-core-warm-${{ github.ref }}-${{ inputs.firmware_hardware || 'every' }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm verified cores (${{ matrix.hardware }})
    # "every" warms each family through CI's own selectors: "all" is the 1.75
    # and 2.06 regular profiles, then the GNSS variant and the e-paper. Two
    # families at a time keep the run inside the runner pool that pull
    # requests share; the AMOLED pair starts first because most pull requests
    # build it.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        hardware: ${{ fromJSON((!inputs.firmware_hardware || inputs.firmware_hardware == 'every') && '["all","175_gnss","397"]' || format('["{0}"]', inputs.firmware_hardware)) }}
    uses: ./.github/workflows/ci.yml
    with:
      scope: firmware
      firmware_hardware: ${{ matrix.hardware }}
