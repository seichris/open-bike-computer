name: Native HealthKit zone follow-up validation
on:
  push:
    branches: [work/healthkit-zones-research-20260915]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-healthkit-workout-zones
      - id: commit
        name: Complete primary ride panel integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ec0d0bfd06b099884b5478197227a40dbc069b26
          python3 - <<'PY'
          from pathlib import Path
          def edit(rel, old, new, count=1):
              p=Path(rel);s=p.read_text();assert s.count(old)==count,(rel,s.count(old));p.write_text(s.replace(old,new))
          edit('ios-app/BikeComputer/BikeComputer/Views/WorkoutViews.swift', '''                if store.presentation.connectionState == .ended,
                             snapshot.nativeZones?.heartRate == nil {
                              HeartRateZoneBreakdown(
                                  durations: snapshot.heartRateZoneDurations
                              )
                          }'''.replace('          ', '', 1), 'UNUSED') if False else None
          p=Path('ios-app/BikeComputer/BikeComputer/Views/WorkoutViews.swift')
          s=p.read_text()
          old='                if store.presentation.connectionState == .ended,\n                   snapshot.nativeZones?.heartRate == nil {\n                    HeartRateZoneBreakdown(\n                        durations: snapshot.heartRateZoneDurations\n                    )\n                }'
          new='                if store.presentation.connectionState == .ended {\n                    if snapshot.nativeZones?.heartRate == nil {\n                        HeartRateZoneBreakdown(\n                            durations: snapshot.heartRateZoneDurations\n                        )\n                    }\n                }'
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          edit('ios-app/BikeComputer/WorkoutShared/WorkoutNativeZones.swift', '    func clearingCurrentZone() -> Self {', '''    /// Cumulative native time in the currently reported zone, not time since
              /// the last transition. Never synthesize a timer between builder reads.
              var currentZoneDuration: TimeInterval? {
                  guard isValid, !isFinal, let currentZone else { return nil }
                  return secondsByZone[Int(currentZone) - 1]
              }
          
              func clearingCurrentZone() -> Self {''')
          p=Path('ios-app/BikeComputer/BikeComputer/Views/NavigationDetailsView.swift')
          s=p.read_text();assert s.count('            HeartRateZoneStrip(currentZone: displayedHeartRateZone)')==2
          s=s.replace('            HeartRateZoneStrip(currentZone: displayedHeartRateZone)','            workoutZoneViews')
          old='    private var workoutMetrics: some View {'
          new='''    @ViewBuilder
              private var workoutZoneViews: some View {
                  let native = workoutStore.presentation.snapshot.nativeZones
                  if let heartRate = native?.heartRate {
                      WorkoutNativeZoneCard(
                          group: heartRate, showCurrent: !suppressInstantaneousMetrics
                      )
                  } else {
                      VStack(spacing: 4) {
                          HeartRateZoneStrip(currentZone: displayedHeartRateZone)
                          Text("Bicino zones · configured maximum heart rate")
                              .font(.caption2)
                              .foregroundStyle(.secondary)
                      }
                  }
                  if let power = native?.cyclingPower {
                      WorkoutNativeZoneCard(
                          group: power, showCurrent: !suppressInstantaneousMetrics
                      )
                  }
              }
          
              private var workoutMetrics: some View {'''
          assert s.count(old)==1;s=s.replace(old,new)
          old='    private var displayedHeartRateZoneElapsedTime: TimeInterval? {\n        suppressInstantaneousMetrics\n            ? nil\n            : workoutStore.currentHeartRateZoneElapsedTime\n    }'
          new='    private var displayedHeartRateZoneElapsedTime: TimeInterval? {\n        guard !suppressInstantaneousMetrics else { return nil }\n        if let native = workoutStore.presentation.snapshot.nativeZones?.heartRate {\n            return native.currentZoneDuration\n        }\n        return workoutStore.currentHeartRateZoneElapsedTime\n    }'
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          edit('ios-app/BikeComputerTests/WorkoutNativeZoneTests.swift', '        print("Native workout zone tests passed (\\(checks) checks)")', '''        let durationGroup = WorkoutNativeZoneSnapshotV1(
                      configuration: configuration(), secondsByZone: [10, 20, 30, 0, 0],
                      observedAt: now, currentZone: 2, currentZoneSampleAt: now,
                      isFinal: false
                  )
                  check(durationGroup.currentZoneDuration == 20, "native current time uses the reported zone total")
                  check(durationGroup.clearingCurrentZone().currentZoneDuration == nil, "unavailable current zone has no current duration")
                  let finalDurationGroup = WorkoutNativeZoneSnapshotV1(
                      configuration: configuration(), secondsByZone: [10, 20, 30, 0, 0],
                      observedAt: now, currentZone: nil, currentZoneSampleAt: nil, isFinal: true
                  )
                  check(finalDurationGroup.currentZoneDuration == nil, "a saved summary has no current-zone timer")
          
                  print("Native workout zone tests passed (\\(checks) checks)")''')
          PY
          git diff --check
          git add ios-app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use native zones and native time-in-zone on the primary ride panel'
          git push origin HEAD:refs/heads/feat/native-healthkit-workout-zones
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  tests:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Native and existing workout contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zone-validation"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-validation/COMMIT_SHA"
          ./ios-app/scripts/run-native-workout-zone-tests.sh 2>&1 | tee "$RUNNER_TEMP/zone-validation/native-tests.log"
          ./ios-app/scripts/run-workout-contract-tests.sh 2>&1 | tee "$RUNNER_TEMP/zone-validation/workout-tests.log"
      - name: Watch source graph
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ./ios-app/scripts/run-watch-source-typecheck.sh 2>&1 | tee "$RUNNER_TEMP/zone-validation/watch-typecheck.log"
      - name: Script and configuration tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cd ios-app
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests 2>&1 | tee "$RUNNER_TEMP/zone-validation/python-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-zone-followup-tests
          path: ${{ runner.temp }}/zone-validation
          retention-days: 7
  build:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Unsigned Release build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zone-validation"
          git rev-parse HEAD > "$RUNNER_TEMP/zone-validation/COMMIT_SHA"
          cd ios-app
          ./scripts/xcodebuild-cli.sh -project BikeComputer/BikeComputer.xcodeproj -scheme BikeComputer -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/zone-derived-data" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/zone-validation/release-build.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-zone-followup-build
          path: ${{ runner.temp }}/zone-validation
          retention-days: 7
