name: HealthKit zone research workspace
on:
  push:
    branches: [work/healthkit-zones-research-20260915]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 85914afc147f8cbd336f5ef17cb8dbdc2fdf85a6
          persist-credentials: false
      - name: Archive exact source and public Apple documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zone-inputs/apple"
          git archive --format=tar.gz -o "$RUNNER_TEMP/zone-inputs/source.tar.gz" HEAD ios-app docs .github AGENTS.md tools/generate_ride_ble_contract.py tools/contracts esp32/lib/ble_navigation esp32/lib/gui esp32/test
          for page in hkworkoutzoneconfiguration hkworkoutzonegroup hkworkoutzone hkliveworkoutzoneupdate hkworkoutzoneduration accessing-workout-zone-data tracking-heart-rate-zones-for-workouts; do
            curl --fail --location --retry 2 "https://developer.apple.com/tutorials/data/documentation/healthkit/${page}.json" -o "$RUNNER_TEMP/zone-inputs/apple/${page}.json" || true
          done
          printf '%s\n' 85914afc147f8cbd336f5ef17cb8dbdc2fdf85a6 > "$RUNNER_TEMP/zone-inputs/BASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: healthkit-zone-inputs
          path: ${{ runner.temp }}/zone-inputs
          retention-days: 2
