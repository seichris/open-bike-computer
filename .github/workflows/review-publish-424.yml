name: Publish verified PR424 reconciliation

on:
  push:
    branches:
      - review/pr-integration-snapshot-2026-09-08
    paths:
      - .github/workflows/review-publish-424.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref == 'refs/heads/review/pr-integration-snapshot-2026-09-08'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 4fa738714d47ba7365487fbf4a724fa1452d400a
          fetch-depth: 0
      - name: Reproduce reviewed tree and update only the PR branch
        shell: bash
        env:
          EXPECTED_HEAD: e41ee05dcc96dff2d07a1846021d07f44740af30
          REVIEWED_MAIN: 89d3c98f3a5d4e7fdfd37bc996113ccf0c61f7bd
          EXPECTED_TREE: 1441e668d2729878d64d11b72723fd584cdd6fb6
          PR_BRANCH: fix/firmware-runtime-ownership
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cp .github/review-integration/reconcile-424.py "$RUNNER_TEMP/reconcile-424.py"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$REVIEWED_MAIN"
          git fetch --no-tags origin "$EXPECTED_HEAD" "$REVIEWED_MAIN"
          git switch --detach "$EXPECTED_HEAD"
          git config user.name 'Chris'
          git config user.email '25006584+seichris@users.noreply.github.com'
          git config commit.gpgsign false
          git branch review-main "$REVIEWED_MAIN"
          if git merge --no-commit --no-ff review-main; then
            echo 'Expected the reviewed startup-order conflict; refusing an unreviewed tree.'
            exit 1
          fi
          test "$(git diff --name-only --diff-filter=U)" = esp32/src/main.cpp
          python3 "$RUNNER_TEMP/reconcile-424.py"
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 esp32/tools/tests/test_runtime_ownership_contract.py
          python3 tools/generate_ride_ble_contract.py --check
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            esp32/tools/tests/test_runtime_ownership.cpp -o "$RUNNER_TEMP/runtime-ownership"
          "$RUNNER_TEMP/runtime-ownership"
          git diff --exit-code
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'Merge current main into PR424 preserving fail-closed boot confirmation'
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          git log -1 --format='Published %H tree=%T'
