name: Apply renderer DMA attribution and gate parity

on:
  push:
    branches:
      - fix/renderer-replay-admission-diagnostics

permissions:
  contents: write

concurrency:
  group: renderer-dma-attribution-v2
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: fix/renderer-replay-admission-diagnostics

      - name: Verify isolated exact-head bootstrap
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            7fd3e2d5628d81e386046e0048d58d635d4ff664 HEAD
          unexpected="$(git diff --name-only \
            7fd3e2d5628d81e386046e0048d58d635d4ff664..HEAD -- \
            ':(exclude).github/scripts/apply_renderer_dma_attribution.py' \
            ':(exclude).github/scripts/correct_renderer_dma_attribution.py' \
            ':(exclude).github/scripts/fix_renderer_memory_session_phase.py' \
            ':(exclude).github/workflows/apply-renderer-dma-attribution.yml' \
            ':(exclude).github/workflows/fix-renderer-memory-session-phase.yml')"
          test -z "$unexpected" || {
            echo "::error::Unexpected pre-existing branch changes"
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Apply deterministic source mutations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path(".github/scripts/apply_renderer_dma_attribution.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace("responseStartedAtMs", "responseStartedMs")
          start_marker = (
              "# Python evaluator mirror: terminal current memory represents "
              "retained state;"
          )
          end_marker = (
              "# Synchronize both gate copies from the intentionally "
              "calibrated app-stack"
          )
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]
          Path("/tmp/apply_renderer_dma_attribution.py").write_text(
              text, encoding="utf-8"
          )

          source = Path(".github/scripts/correct_renderer_dma_attribution.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace("responseStartedAtMs", "responseStartedMs")
          Path("/tmp/correct_renderer_dma_attribution.py").write_text(
              text, encoding="utf-8"
          )
          PY
          python3 /tmp/apply_renderer_dma_attribution.py
          python3 .github/scripts/fix_renderer_memory_session_phase.py
          python3 /tmp/correct_renderer_dma_attribution.py
          git diff --check
          actual="$(
            { git diff --name-only; git ls-files --others --exclude-standard; } \
              | sort -u
          )"
          expected="$(cat <<'EOF'
          esp32/lib/device_debug/device_debug_http.cpp
          esp32/lib/renderer_diagnostics/renderer_diagnostics.cpp
          esp32/lib/renderer_diagnostics/renderer_diagnostics.hpp
          esp32/lib/renderer_diagnostics/renderer_diagnostics_policy.hpp
          esp32/tools/renderer_benchmark.py
          esp32/tools/renderer_benchmark_gates.json
          esp32/tools/tests/test_renderer_benchmark_cross_run_memory.py
          esp32/tools/tests/test_renderer_benchmark_gate_parity.py
          esp32/tools/tests/test_renderer_diagnostics.cpp
          esp32/tools/tests/test_renderer_dma_attribution_contract.py
          ios-app/BikeComputer/BikeComputer/Resources/renderer-benchmark-gates-v1.json
          EOF
          )"
          test "$actual" = "$expected" || {
            echo "::error::Unexpected changed-file set"
            printf 'Actual:\n%s\nExpected:\n%s\n' "$actual" "$expected"
            exit 1
          }

      - name: Verify canonical gate calibration
        run: |
          set -euo pipefail
          cmp \
            esp32/tools/renderer_benchmark_gates.json \
            ios-app/BikeComputer/BikeComputer/Resources/renderer-benchmark-gates-v1.json
          actual="$(sha256sum esp32/tools/renderer_benchmark_gates.json | cut -d' ' -f1)"
          test "$actual" = \
            09fa69a3355643ca1f87072ca1815bde7ba54be782677e5208d1eca296c5608d
          python3 - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(
              Path("esp32/tools/renderer_benchmark_gates.json").read_text()
          )
          assert gate["absolute"]["minimumMetricsSampleFraction"] == 0.3
          assert gate["trend"]["crossRunDmaAllowedDeclineBytes"] == 1024
          PY

      - name: Run focused firmware and evaluator regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        working-directory: esp32
        run: |
          set -euo pipefail
          python3 tools/tests/test_renderer_benchmark_gate_parity.py
          python3 tools/tests/test_renderer_benchmark_cross_run_memory.py
          python3 tools/tests/test_renderer_dma_attribution_contract.py
          python3 -m py_compile \
            tools/renderer_benchmark.py \
            tools/tests/test_renderer_benchmark_cross_run_memory.py \
            tools/tests/test_renderer_benchmark_gate_parity.py \
            tools/tests/test_renderer_dma_attribution_contract.py
          for test in \
            test_renderer_diagnostics \
            test_renderer_diagnostics_ble_protocol \
            test_renderer_diagnostics_request; do
            g++ -std=c++17 -Wall -Wextra -Werror \
              "tools/tests/${test}.cpp" \
              -o "/tmp/${test}"
            "/tmp/${test}"
          done

      - name: Build exact remote-debug firmware
        working-directory: esp32
        run: |
          set -euo pipefail
          python3 tools/build_firmware.py \
            WAVESHARE_AMOLED_175_REMOTE_DEBUG
          strings .pio/build/WAVESHARE_AMOLED_175_REMOTE_DEBUG/firmware.elf \
            | grep -F 'windowMinimumFreeAttribution'
          strings .pio/build/WAVESHARE_AMOLED_175_REMOTE_DEBUG/firmware.elf \
            | grep -F 'frameTransferActive'

      - name: Build ordinary non-debug firmware
        working-directory: esp32
        run: |
          set -euo pipefail
          python3 tools/build_firmware.py WAVESHARE_AMOLED_175

      - name: Restore build-generated configuration and audit diff
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree --staged -- \
            ':(glob)esp32/sdkconfig*' || true
          git diff --check
          actual="$(
            { git diff --name-only; git ls-files --others --exclude-standard; } \
              | sort -u
          )"
          expected="$(cat <<'EOF'
          esp32/lib/device_debug/device_debug_http.cpp
          esp32/lib/renderer_diagnostics/renderer_diagnostics.cpp
          esp32/lib/renderer_diagnostics/renderer_diagnostics.hpp
          esp32/lib/renderer_diagnostics/renderer_diagnostics_policy.hpp
          esp32/tools/renderer_benchmark.py
          esp32/tools/renderer_benchmark_gates.json
          esp32/tools/tests/test_renderer_benchmark_cross_run_memory.py
          esp32/tools/tests/test_renderer_benchmark_gate_parity.py
          esp32/tools/tests/test_renderer_diagnostics.cpp
          esp32/tools/tests/test_renderer_dma_attribution_contract.py
          ios-app/BikeComputer/BikeComputer/Resources/renderer-benchmark-gates-v1.json
          EOF
          )"
          test "$actual" = "$expected"

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/apply_renderer_dma_attribution.py \
            .github/scripts/correct_renderer_dma_attribution.py \
            .github/scripts/fix_renderer_memory_session_phase.py \
            .github/workflows/apply-renderer-dma-attribution.yml \
            .github/workflows/fix-renderer-memory-session-phase.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Attribute renderer DMA minima by phase"
          git push origin HEAD:fix/renderer-replay-admission-diagnostics
