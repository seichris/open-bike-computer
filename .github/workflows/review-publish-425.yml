name: Validate and publish reconciled PR425
on:
  push:
    branches: [review/pr-integration-snapshot-2026-09-08]
    paths: [.github/workflows/review-publish-425.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/review/pr-integration-snapshot-2026-09-08'
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: 8dcbc540b518a6d63e171160dea906bf8096c2e6
      REVIEWED_MAIN: 25b6352e69c39af66369743b57dd6f76c92c5e91
      EXPECTED_TREE: d8bf022d9d1bc2e2a950ac921455f539132f4c7a
      PR_BRANCH: fix/offline-map-lifecycle-durability
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 151ba47d9d2b13acfd5b580b2a915e92753bc968
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch transport and construct the reviewed integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review425"
          cp .github/review-integration/pr425.patch.gz.b64 "$RUNNER_TEMP/review425/transport.b64"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'review425'
          text = (root / 'transport.b64').read_text().strip()
          # Correct two observed text-transport omissions. The uncompressed
          # checksum AND final Git tree must still match the reviewed source.
          text = text.replace('KuuUhwyD9mX', 'KuuUhwyZD9mX').replace('F6Qda+ETx', 'F6Qda++ETx')
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert len(patch) == 44762
          assert hashlib.sha256(patch).hexdigest() == '1212798ef19292010e01d2a79aebf08470e6396535429d204713f2deee3b15cc'
          (root / 'integration.patch').write_bytes(patch)
          PY
          git ls-remote origin "refs/heads/$PR_BRANCH" refs/heads/main
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$EXPECTED_HEAD" "$REVIEWED_MAIN"
          git switch --detach "$EXPECTED_HEAD"
          git config user.name 'Chris'
          git config user.email '25006584+seichris@users.noreply.github.com'
          git config commit.gpgsign false
          git merge --no-commit --no-ff "$REVIEWED_MAIN"
          git apply --check "$RUNNER_TEMP/review425/integration.patch"
          git apply "$RUNNER_TEMP/review425/integration.patch"
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 tools/generate_ride_ble_contract.py --check
      - name: Run full navigation suite including production download attempt regressions
        run: ./scripts/run-navigation-tests.sh
        working-directory: ios-app
      - name: Publish only the reviewed PR branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          commit=$(git commit-tree "$EXPECTED_TREE" -p "$EXPECTED_HEAD" -p "$REVIEWED_MAIN" -m 'Reconcile PR425 with main and fence durable downloads by persisted attempt identity')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')" \
            push origin "$commit:refs/heads/$PR_BRANCH"
          git show -s --format='Published %H tree=%T' "$commit"
      - name: Retain transport diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr425-integration-transport-diagnostics
          path: ${{ runner.temp }}/review425/
          retention-days: 3
          if-no-files-found: ignore
