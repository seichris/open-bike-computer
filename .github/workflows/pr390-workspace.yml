name: PR390 temporary review workspace
on:
  push:
    branches: [feature/world-radio-screen]
    paths: [.github/workflows/pr390-workspace.yml]
permissions:
  contents: read
jobs:
  validate-and-publish:
    if: github.repository == 'seichris/open-bike-computer' && github.ref == 'refs/heads/feature/world-radio-screen'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply exact locally tested changes, without replacing concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 76f91f6847db43c9d548c1c4406b68ea1a2b82c7 HEAD -- . ':(exclude).github/workflows/pr390-workspace.yml' ':(exclude).github/pr390-patch-0.b64' ':(exclude).github/pr390-patch-1.b64' ':(exclude).github/pr390-patch-2.b64'
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/pr390-patch-{i}.b64').read_text() for i in range(3))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'a61c8e1686b0c1a9c9f97dad09c1076173bd67b65098743387de854bc3744486'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'f07f51232ef5177c2d512d5027aa22867c3b9353439b4520a72d766d4fa87aa8'
          Path('/tmp/pr390-tested.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero /tmp/pr390-tested.patch
          git apply --index --unidiff-zero /tmp/pr390-tested.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 29
      - name: Validate C++ in production and development modes
        shell: bash
        run: |
          set -euo pipefail
          for mode in 0 1; do
            for test in world_radio_protocol world_radio_presentation world_radio_viewport world_radio_raster main_screen_registry screen_configuration_protocol device_screen_protocol device_capabilities_protocol; do
              c++ -std=c++17 -O2 -Wall -Wextra -Werror -DFIRMWARE_DIAGNOSTICS=$mode "esp32/tools/tests/test_${test}.cpp" -o "/tmp/pr390-${test}-${mode}"
              "/tmp/pr390-${test}-${mode}"
            done
          done
      - name: Typecheck the real AVPlayer adapter against the iPhone SDK
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc --version
          xcrun --sdk iphoneos swiftc -swift-version 6 -strict-concurrency=complete -default-isolation MainActor -typecheck -target arm64-apple-ios16.4 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            ios-app/BikeComputer/BikeComputer/Models/WorldRadioProtocol.swift \
            ios-app/BikeComputer/BikeComputer/Services/WorldRadioService.swift \
            ios-app/BikeComputer/RideShared/RideBLEProtocol.generated.swift \
            ios-app/BikeComputer/RideShared/WireBytes.swift
      - name: Run the complete portable iOS suite and generated-contract checks
        shell: bash
        run: |
          set -euo pipefail
          bash ios-app/scripts/run-navigation-tests.sh
          python3 tools/generate_ride_ble_contract.py --check
          git diff --cached --check
          git diff --exit-code
      - name: Publish only the validated source changes to PR390
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/world-radio-screen
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden World Radio playback and reuse shared contracts'
          git push origin HEAD:refs/heads/feature/world-radio-screen
          echo "PR390_SOURCE_COMMIT=$(git rev-parse HEAD)"
